<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角度の作図（60°, 30°, 45°）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f3f4f6;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-6 px-4">

    <div class="w-full max-w-4xl">
        <!-- ヘッダー -->
        <div class="text-center mb-4">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">📐 角度の作図</h1>
            <p class="text-sm md:text-base text-gray-600">60°、30°、45°の作図方法をマスターしよう！</p>
        </div>

        <!-- タブ切り替え -->
        <div class="flex justify-center mb-4">
            <div class="bg-gray-200 p-1 rounded-xl flex flex-col sm:flex-row gap-1">
                <button onclick="setMode(1)" id="tab-mode-1" class="px-4 py-2 rounded-lg font-bold transition-colors bg-white text-blue-600 shadow-sm text-sm sm:text-base">
                    (1) ∠BAC = 60°
                </button>
                <button onclick="setMode(2)" id="tab-mode-2" class="px-4 py-2 rounded-lg font-bold transition-colors text-gray-600 hover:bg-gray-300 text-sm sm:text-base">
                    (2) ∠BAD = 30°
                </button>
                <button onclick="setMode(3)" id="tab-mode-3" class="px-4 py-2 rounded-lg font-bold transition-colors text-gray-600 hover:bg-gray-300 text-sm sm:text-base">
                    (3) ∠BAE = 45°
                </button>
            </div>
        </div>

        <!-- キャンバスエリア -->
        <div class="w-full bg-white p-2 rounded-2xl shadow-xl border border-gray-200 flex justify-center">
            <canvas id="simCanvas" width="800" height="600" class="w-full max-h-[45vh] object-contain rounded-xl bg-slate-50 block"></canvas>
        </div>

        <!-- コントロールと説明エリア -->
        <div class="flex flex-col md:flex-row gap-4 mt-4">
            <!-- 説明テキスト -->
            <div class="flex-1 bg-white p-4 rounded-2xl shadow-md border border-gray-200 flex flex-col justify-center min-h-[140px]">
                <h2 id="step-title" class="text-xl md:text-2xl font-bold text-blue-600 mb-2">読み込み中...</h2>
                <p id="step-text" class="text-gray-700 text-sm md:text-base leading-relaxed whitespace-pre-wrap"></p>
            </div>

            <!-- ボタン類 -->
            <div class="flex flex-col sm:flex-row md:flex-col gap-2 justify-center shrink-0">
                <button onclick="prevStep()" id="prev-btn" class="w-full sm:w-auto md:w-full px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm text-sm">
                    ＜ 前のステップ
                </button>
                <button onclick="togglePlay()" id="play-btn" class="w-full sm:w-auto md:w-full px-6 py-3 bg-blue-500 text-white font-bold rounded-xl hover:bg-blue-600 active:scale-95 shadow-md transition flex items-center justify-center gap-2">
                    <svg id="icon-play" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg id="icon-pause" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="play-btn-text" class="text-base">再生</span>
                </button>
                <button onclick="nextStep()" id="next-btn" class="w-full sm:w-auto md:w-full px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm text-sm">
                    次のステップ ＞
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // モード1: 60°
        const stepsData1 = [
            { title: "(1) ∠BAC=60° : はじめに", text: "∠BAC=60°となる線分ACを作図します。\n「正三角形」の3つの角がすべて60°であることを利用します！" },
            { title: "ステップ 1 : 点Aから弧を描く", text: "コンパスの針を点Aに刺し、適当な長さで弧を描きます。\n線分ABとの交点をPとします。" },
            { title: "ステップ 2 : 点Pから弧を描く", text: "コンパスの開き具合（半径）を変えずに、針を点Pに刺します。\n先ほど描いた弧と交差するように弧を描き、交点をCとします。" },
            { title: "ステップ 3 : 線分を引く", text: "定規を使って、点Aから点Cを通る直線を引きます。" },
            { title: "完成！", text: "これで∠BAC=60°の完成です！\n点A, P, Cを結ぶと正三角形になるため、角は60°になります。" }
        ];

        // モード2: 30°
        const stepsData2 = [
            { title: "(2) ∠BAD=30° : はじめに", text: "∠BAD=30°となる線分ADを作図します。\n60°を作図したあと、その「角の二等分線」を引くのがポイントです。" },
            { title: "ステップ 1 : 60°の作図", text: "まずは(1)と同じ手順で、60°の基準となる点Cを作図し、半直線ACを引いて60°の角を作ります。" },
            { title: "ステップ 2 : 点Pから弧を描く", text: "角の二等分線を引きます。\nコンパスの針を点Pに刺し、角の真ん中あたりに弧を描きます。" },
            { title: "ステップ 3 : 点Cから弧を描く", text: "コンパスの半径を変えずに、針を点Cに刺します。\nステップ2の弧と交差するように弧を描き、交点をDとします。" },
            { title: "ステップ 4 : 線分を引く", text: "定規を使って、点Aから点Dを通る直線を引きます。" },
            { title: "完成！", text: "これで∠BAD=30°の完成です！\n60°の角を半分にしたので、30°になります。" }
        ];

        // モード3: 45°
        const stepsData3 = [
            { title: "(3) ∠BAE=45° : はじめに", text: "∠BAE=45°となる線分AEを作図します。\n「90°（垂線）」を作図したあと、その「角の二等分線」を引きます。" },
            { title: "ステップ 1 : 90°の準備", text: "点Aを通る垂線を作図します。\n線分ABを延長し、点Aから弧を描いて交点を2つ(F, G)作ります。" },
            { title: "ステップ 2 : 垂線を引く", text: "点F, Gから弧を描いて交点を作り、点Aを通る垂線を引きます。\n垂線と最初の弧の交点をHとします。（これで90°ができました）" },
            { title: "ステップ 3 : 角の二等分線の準備", text: "90°の角の二等分線を引きます。\n点G, Hからそれぞれ同じ半径で弧を描き、交点をEとします。" },
            { title: "ステップ 4 : 線分を引く", text: "定規を使って、点Aから点Eを通る直線を引きます。" },
            { title: "完成！", text: "これで∠BAE=45°の完成です！\n90°の角を半分にしたので、45°になります。" }
        ];

        let currentMode = 1; 
        let stepsData = stepsData1;
        let currentStepIndex = 0; 
        let stepProgress = 0; 
        let isPlaying = false;
        let lastTime = 0;

        function setMode(mode) {
            currentMode = mode;
            if(mode === 1) stepsData = stepsData1;
            else if(mode === 2) stepsData = stepsData2;
            else stepsData = stepsData3;
            
            currentStepIndex = 0;
            stepProgress = 0;
            isPlaying = false;
            
            const activeClass = "px-4 py-2 rounded-lg font-bold transition-colors bg-white text-blue-600 shadow-sm text-sm sm:text-base";
            const inactiveClass = "px-4 py-2 rounded-lg font-bold transition-colors text-gray-600 hover:bg-gray-300 text-sm sm:text-base";
            
            document.getElementById('tab-mode-1').className = (mode === 1) ? activeClass : inactiveClass;
            document.getElementById('tab-mode-2').className = (mode === 2) ? activeClass : inactiveClass;
            document.getElementById('tab-mode-3').className = (mode === 3) ? activeClass : inactiveClass;
            
            updateUI();
            drawScene();
        }

        function updateUI() {
            document.getElementById('step-title').innerText = stepsData[currentStepIndex].title;
            document.getElementById('step-text').innerText = stepsData[currentStepIndex].text;
            
            const btnText = document.getElementById('play-btn-text');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            
            if (isPlaying) {
                btnText.innerText = "一時停止";
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                if (stepProgress >= 1 && currentStepIndex === stepsData.length - 1) {
                    btnText.innerText = "最初から見る";
                } else if (stepProgress >= 1) {
                    btnText.innerText = "次へ再生";
                } else {
                    btnText.innerText = "再生";
                }
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
            
            document.getElementById('prev-btn').disabled = (currentStepIndex === 0 && stepProgress === 0);
            document.getElementById('next-btn').disabled = (currentStepIndex === stepsData.length - 1 && stepProgress >= 1);
        }

        function nextStep() {
            if (currentStepIndex < stepsData.length - 1) {
                currentStepIndex++;
                stepProgress = 0;
                isPlaying = true;
            } else {
                currentStepIndex = 0;
                stepProgress = 0;
                isPlaying = true;
            }
            updateUI();
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                if (stepProgress > 0) {
                    stepProgress = 0;
                    isPlaying = true;
                } else {
                    currentStepIndex--;
                    stepProgress = 0;
                    isPlaying = true;
                }
            }
            updateUI();
        }

        function togglePlay() {
            if (stepProgress >= 1) {
                if (currentStepIndex < stepsData.length - 1) {
                    nextStep();
                } else {
                    currentStepIndex = 0;
                    stepProgress = 0;
                    isPlaying = true;
                }
            } else {
                isPlaying = !isPlaying;
            }
            updateUI();
        }

        function getPhase(progress, start, end) {
            if (progress <= start) return 0;
            if (progress >= end) return 1;
            return (progress - start) / (end - start);
        }

        function drawRuler(ctx, x, y, length, angle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-20, 0, length + 40, 40);
            ctx.strokeRect(-20, 0, length + 40, 40);
            
            ctx.beginPath();
            for(let i = 0; i <= length; i += 10) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i, (i % 50 === 0) ? 15 : 8);
            }
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        function drawCompass(ctx, x, y, radius, drawAngle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(drawAngle);
            
            const hx = radius / 2;
            const hy = -150;
            
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(0, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#9ca3af'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(radius, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#60a5fa'; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 35);
            ctx.lineWidth = 10; ctx.strokeStyle = '#374151'; ctx.stroke();
            
            ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#d1d5db'; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#1f2937'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(radius - 8, -12); ctx.lineTo(radius, 0); ctx.lineTo(radius - 3, -14);
            ctx.fillStyle = '#1f2937'; ctx.fill();
            ctx.restore();
        }

        function drawBackground() {
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        // 共通座標
        const A = { x: 250, y: 450 };
        const B = { x: 650, y: 450 };
        
        // 60度用
        const r1 = 250;
        const P1 = { x: A.x + r1, y: A.y };
        const C = { x: A.x + r1 * Math.cos(-Math.PI/3), y: A.y + r1 * Math.sin(-Math.PI/3) };
        
        // 30度用
        const r2 = 220;
        // 幾何学的に正確な交点Dの座標を計算
        const distD = r1 * Math.cos(Math.PI/6) + Math.sqrt(r2*r2 - Math.pow(r1 * Math.sin(Math.PI/6), 2));
        const Dx = A.x + distD * Math.cos(-Math.PI/6);
        const Dy = A.y + distD * Math.sin(-Math.PI/6);
        // コンパスの描画角度用
        const angleP1toD = Math.atan2(Dy - P1.y, Dx - P1.x);
        const angleCtoD = Math.atan2(Dy - C.y, Dx - C.x);

        // 45度用
        const r_perp1 = 120;
        const F = { x: A.x - r_perp1, y: A.y };
        const G = { x: A.x + r_perp1, y: A.y };
        const r_perp2 = 200;
        const H = { x: A.x, y: A.y - r_perp1 }; // 垂線と最初の弧の交点 (250, 330)
        const r_bisect = 180;
        // 幾何学的に正確な交点Eの座標を計算
        const distE = r_perp1 * Math.cos(Math.PI/4) + Math.sqrt(r_bisect*r_bisect - Math.pow(r_perp1 * Math.sin(Math.PI/4), 2));
        const Ex = A.x + distE * Math.cos(-Math.PI/4);
        const Ey = A.y + distE * Math.sin(-Math.PI/4);
        // コンパスの描画角度用
        const angleGtoE = Math.atan2(Ey - G.y, Ex - G.x);
        const angleHtoE = Math.atan2(Ey - H.y, Ex - H.x);

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            // ベースの線分AB
            ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
            
            ctx.fillStyle = '#1f2937'; ctx.font = "italic 24px 'M PLUS Rounded 1c', sans-serif";
            ctx.beginPath(); ctx.arc(A.x, A.y, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillText("A", A.x - 20, A.y + 25);
            ctx.beginPath(); ctx.arc(B.x, B.y, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillText("B", B.x + 10, B.y + 25);

            if (currentMode === 1) {
                let p = { arcA: 0, arcP: 0, lineAC: 0, finish: 0 };
                for (let i = 1; i <= 4; i++) {
                    let key = Object.keys(p)[i-1];
                    if (currentStepIndex > i) p[key] = 1.0;
                    else if (currentStepIndex === i) p[key] = stepProgress;
                    else p[key] = 0.0;
                }

                // 【ステップ1】 点Aから弧
                if (p.arcA > 0) {
                    let alpha = getPhase(p.arcA, 0, 0.1) - getPhase(p.arcA, 0.9, 1.0);
                    let arcT = getPhase(p.arcA, 0.1, 0.9);
                    let s = 10 * Math.PI/180; let e = -70 * Math.PI/180;
                    let c = s + (e - s) * arcT;
                    ctx.beginPath(); ctx.arc(A.x, A.y, r1, s, c, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, A.x, A.y, r1, c, alpha);
                    
                    if (p.arcA >= 0.9 || currentStepIndex > 1) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(P1.x, P1.y, 5, 0, Math.PI*2); ctx.fill();
                        ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("P", P1.x + 10, P1.y + 25);
                    }
                }

                // 【ステップ2】 点Pから弧
                if (p.arcP > 0) {
                    let alpha = getPhase(p.arcP, 0, 0.1) - getPhase(p.arcP, 0.9, 1.0);
                    let arcT = getPhase(p.arcP, 0.1, 0.9);
                    let s = -110 * Math.PI/180; let e = -160 * Math.PI/180;
                    let c = s + (e - s) * arcT;
                    ctx.beginPath(); ctx.arc(P1.x, P1.y, r1, s, c, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, P1.x, P1.y, r1, c, alpha);
                    
                    if (p.arcP >= 0.9 || currentStepIndex > 2) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(C.x, C.y, 5, 0, Math.PI*2); ctx.fill();
                        ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("C", C.x - 10, C.y - 15);
                    }
                }

                // 【ステップ3】 線分AC
                if (p.lineAC > 0) {
                    let alpha = getPhase(p.lineAC, 0, 0.15) - getPhase(p.lineAC, 0.85, 1.0);
                    let lineT = getPhase(p.lineAC, 0.15, 0.85);
                    let ang = -Math.PI/3;
                    if (alpha > 0) drawRuler(ctx, A.x, A.y, 350, ang, alpha);
                    ctx.beginPath(); ctx.moveTo(A.x, A.y);
                    ctx.lineTo(A.x + 350 * lineT * Math.cos(ang), A.y + 350 * lineT * Math.sin(ang));
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
                }

                // 完成
                if (p.finish > 0) {
                    ctx.globalAlpha = p.finish;
                    ctx.beginPath(); ctx.arc(A.x, A.y, 40, 0, -Math.PI/3, true);
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#ef4444'; ctx.font = "bold 20px sans-serif"; ctx.fillText("60°", A.x + 50, A.y - 20);
                    ctx.globalAlpha = 1;
                }

            } else if (currentMode === 2) {
                let p = { prep60: 0, arcP2: 0, arcC: 0, lineAD: 0, finish: 0 };
                for (let i = 1; i <= 5; i++) {
                    let key = Object.keys(p)[i-1];
                    if (currentStepIndex > i) p[key] = 1.0;
                    else if (currentStepIndex === i) p[key] = stepProgress;
                    else p[key] = 0.0;
                }

                // 【ステップ1】 60度の作図を一気に行う
                if (p.prep60 > 0) {
                    let p1 = getPhase(p.prep60, 0, 0.33);
                    let p2 = getPhase(p.prep60, 0.33, 0.66);
                    let p3 = getPhase(p.prep60, 0.66, 1.0);
                    
                    if (p1 > 0) {
                        ctx.beginPath(); ctx.arc(A.x, A.y, r1, 10*Math.PI/180, -70*Math.PI/180, true);
                        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.stroke();
                        ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(P1.x, P1.y, 4, 0, Math.PI*2); ctx.fill();
                        ctx.fillText("P", P1.x + 10, P1.y + 25);
                    }
                    if (p2 > 0) {
                        ctx.beginPath(); ctx.arc(P1.x, P1.y, r1, -110*Math.PI/180, -160*Math.PI/180, true);
                        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.stroke();
                        ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(C.x, C.y, 4, 0, Math.PI*2); ctx.fill();
                        ctx.fillText("C", C.x - 10, C.y - 15);
                    }
                    if (p3 > 0) {
                        let alpha = getPhase(p3, 0, 0.15) - getPhase(p3, 0.85, 1.0);
                        let lineT = getPhase(p3, 0.15, 0.85);
                        let ang = -Math.PI/3;
                        if (alpha > 0) drawRuler(ctx, A.x, A.y, 350, ang, alpha);
                        ctx.beginPath(); ctx.moveTo(A.x, A.y);
                        ctx.lineTo(A.x + 350 * lineT * Math.cos(ang), A.y + 350 * lineT * Math.sin(ang));
                        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.stroke();
                    }
                }

                // 【ステップ2】 点Pから弧を描く
                if (p.arcP2 > 0) {
                    let alpha = getPhase(p.arcP2, 0, 0.1) - getPhase(p.arcP2, 0.9, 1.0);
                    let arcT = getPhase(p.arcP2, 0.1, 0.9);
                    let s = angleP1toD - 0.4; let e = angleP1toD + 0.4;
                    let c = s + (e - s) * arcT;
                    ctx.beginPath(); ctx.arc(P1.x, P1.y, r2, s, c, false);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, P1.x, P1.y, r2, c, alpha);
                }

                // 【ステップ3】 点Cから弧を描く
                if (p.arcC > 0) {
                    let alpha = getPhase(p.arcC, 0, 0.1) - getPhase(p.arcC, 0.9, 1.0);
                    let arcT = getPhase(p.arcC, 0.1, 0.9);
                    let s = angleCtoD + 0.4; let e = angleCtoD - 0.4;
                    let c = s + (e - s) * arcT;
                    ctx.beginPath(); ctx.arc(C.x, C.y, r2, s, c, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, C.x, C.y, r2, c, alpha);
                    
                    if (p.arcC >= 0.9 || currentStepIndex > 3) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(Dx, Dy, 5, 0, Math.PI*2); ctx.fill();
                        ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("D", Dx + 15, Dy + 5);
                    }
                }

                // 【ステップ4】 線分AD
                if (p.lineAD > 0) {
                    let alpha = getPhase(p.lineAD, 0, 0.15) - getPhase(p.lineAD, 0.85, 1.0);
                    let lineT = getPhase(p.lineAD, 0.15, 0.85);
                    let ang = -Math.PI/6;
                    if (alpha > 0) drawRuler(ctx, A.x, A.y, 400, ang, alpha);
                    ctx.beginPath(); ctx.moveTo(A.x, A.y);
                    ctx.lineTo(A.x + 400 * lineT * Math.cos(ang), A.y + 400 * lineT * Math.sin(ang));
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
                }

                // 完成
                if (p.finish > 0) {
                    ctx.globalAlpha = p.finish;
                    ctx.beginPath(); ctx.arc(A.x, A.y, 50, 0, -Math.PI/6, true);
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#ef4444'; ctx.font = "bold 20px sans-serif"; ctx.fillText("30°", A.x + 60, A.y - 10);
                    ctx.globalAlpha = 1;
                }

            } else {
                let p = { prep90_1: 0, prep90_2: 0, arcGH: 0, lineAE: 0, finish: 0 };
                for (let i = 1; i <= 5; i++) {
                    let key = Object.keys(p)[i-1];
                    if (currentStepIndex > i) p[key] = 1.0;
                    else if (currentStepIndex === i) p[key] = stepProgress;
                    else p[key] = 0.0;
                }

                // 【ステップ1】 延長線と点Aからの弧
                if (p.prep90_1 > 0) {
                    let p1 = getPhase(p.prep90_1, 0, 0.3); // 延長線
                    let p2 = getPhase(p.prep90_1, 0.3, 1.0); // 弧
                    
                    if (p1 > 0) {
                        ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(A.x - 200 * p1, A.y);
                        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                    }
                    if (p2 > 0) {
                        let alpha = getPhase(p2, 0, 0.1) - getPhase(p2, 0.9, 1.0);
                        let arcT = getPhase(p2, 0.1, 0.9);
                        let s = 10 * Math.PI/180; let e = -190 * Math.PI/180;
                        let c = s + (e - s) * arcT;
                        ctx.beginPath(); ctx.arc(A.x, A.y, r_perp1, s, c, true);
                        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.stroke();
                        if (alpha > 0) drawCompass(ctx, A.x, A.y, r_perp1, c, alpha);
                    }
                    if (p.prep90_1 >= 0.9 || currentStepIndex > 1) {
                        ctx.fillStyle = '#6b7280'; ctx.beginPath(); ctx.arc(F.x, F.y, 4, 0, Math.PI*2); ctx.arc(G.x, G.y, 4, 0, Math.PI*2); ctx.fill();
                        ctx.fillText("F", F.x - 15, F.y + 25); ctx.fillText("G", G.x + 5, G.y + 25);
                    }
                }

                // 【ステップ2】 F,Gからの弧と垂線
                if (p.prep90_2 > 0) {
                    let p1 = getPhase(p.prep90_2, 0, 0.3); // Fから
                    let p2 = getPhase(p.prep90_2, 0.3, 0.6); // Gから
                    let p3 = getPhase(p.prep90_2, 0.6, 1.0); // 垂線
                    
                    if (p1 > 0) {
                        let s = -30 * Math.PI/180; let e = -80 * Math.PI/180;
                        ctx.beginPath(); ctx.arc(F.x, F.y, r_perp2, s, s+(e-s)*p1, true); ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.stroke();
                    }
                    if (p2 > 0) {
                        let s = -150 * Math.PI/180; let e = -100 * Math.PI/180;
                        ctx.beginPath(); ctx.arc(G.x, G.y, r_perp2, s, s+(e-s)*p2, false); ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.stroke();
                    }
                    if (p3 > 0) {
                        ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(A.x, A.y - 200 * p3);
                        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.stroke();
                    }
                    if (p.prep90_2 >= 0.9 || currentStepIndex > 2) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(H.x, H.y, 5, 0, Math.PI*2); ctx.fill();
                        ctx.fillText("H", H.x + 10, H.y - 5);
                    }
                }

                // 【ステップ3】 G,Hからの弧
                if (p.arcGH > 0) {
                    let p1 = getPhase(p.arcGH, 0, 0.5); // Gから
                    let p2 = getPhase(p.arcGH, 0.5, 1.0); // Hから
                    
                    if (p1 > 0) {
                        let alpha = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                        let arcT = getPhase(p1, 0.2, 0.8);
                        let s = angleGtoE + 0.4; let e = angleGtoE - 0.4;
                        let c = s + (e - s) * arcT;
                        ctx.beginPath(); ctx.arc(G.x, G.y, r_bisect, s, c, true);
                        ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                        if (alpha > 0) drawCompass(ctx, G.x, G.y, r_bisect, c, alpha);
                    }
                    
                    if (p2 > 0) {
                        let alpha = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                        let arcT = getPhase(p2, 0.2, 0.8);
                        let s = angleHtoE - 0.4; let e = angleHtoE + 0.4;
                        let c = s + (e - s) * arcT;
                        ctx.beginPath(); ctx.arc(H.x, H.y, r_bisect, s, c, false);
                        ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                        if (alpha > 0) drawCompass(ctx, H.x, H.y, r_bisect, c, alpha);
                    }
                    
                    if (p.arcGH >= 0.9 || currentStepIndex > 3) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(Ex, Ey, 5, 0, Math.PI*2); ctx.fill();
                        ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("E", Ex + 15, Ey - 5);
                    }
                }

                // 【ステップ4】 線分AE
                if (p.lineAE > 0) {
                    let alpha = getPhase(p.lineAE, 0, 0.15) - getPhase(p.lineAE, 0.85, 1.0);
                    let lineT = getPhase(p.lineAE, 0.15, 0.85);
                    let ang = -Math.PI/4;
                    if (alpha > 0) drawRuler(ctx, A.x, A.y, 300, ang, alpha);
                    ctx.beginPath(); ctx.moveTo(A.x, A.y);
                    ctx.lineTo(A.x + 300 * lineT * Math.cos(ang), A.y + 300 * lineT * Math.sin(ang));
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
                }

                // 完成
                if (p.finish > 0) {
                    ctx.globalAlpha = p.finish;
                    ctx.beginPath(); ctx.arc(A.x, A.y, 45, 0, -Math.PI/4, true);
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#ef4444'; ctx.font = "bold 20px sans-serif"; ctx.fillText("45°", A.x + 55, A.y - 15);
                    
                    // 90度マーク
                    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(A.x + 15, A.y); ctx.lineTo(A.x + 15, A.y - 15); ctx.lineTo(A.x, A.y - 15); ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (isPlaying) {
                let duration = 2500;
                if (currentMode === 1) {
                    if (currentStepIndex === 1) duration = 2500;
                    if (currentStepIndex === 2) duration = 2500;
                    if (currentStepIndex === 3) duration = 2000;
                    if (currentStepIndex === 4) duration = 1500;
                } else if (currentMode === 2) {
                    if (currentStepIndex === 1) duration = 4000;
                    if (currentStepIndex === 2) duration = 2000;
                    if (currentStepIndex === 3) duration = 2000;
                    if (currentStepIndex === 4) duration = 2000;
                    if (currentStepIndex === 5) duration = 1500;
                } else {
                    if (currentStepIndex === 1) duration = 3500;
                    if (currentStepIndex === 2) duration = 4000;
                    if (currentStepIndex === 3) duration = 3000;
                    if (currentStepIndex === 4) duration = 2000;
                    if (currentStepIndex === 5) duration = 1500;
                }

                if (currentStepIndex > 0) {
                    stepProgress += dt / duration;
                    if (stepProgress >= 1.0) {
                        stepProgress = 1.0;
                        isPlaying = false;
                    }
                }
                updateUI();
            }

            drawScene();
            requestAnimationFrame(loop);
        }

        window.onload = () => {
            updateUI();
            requestAnimationFrame(loop);
        };
    </script>
</body>
