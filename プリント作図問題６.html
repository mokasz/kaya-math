<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垂線を2回引く平行線の作図</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f3f4f6;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-8 px-4">

    <div class="w-full max-w-4xl">
        <!-- ヘッダー -->
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">📐 垂線を用いた平行線の作図</h1>
            <p class="text-gray-600">「垂線に垂直な直線は平行になる」性質を利用して作図しよう！</p>
        </div>

        <!-- キャンバスエリア -->
        <div class="w-full bg-white p-2 rounded-2xl shadow-xl border border-gray-200">
            <canvas id="simCanvas" width="800" height="600" class="w-full max-h-[45vh] object-contain rounded-xl bg-slate-50 block"></canvas>
        </div>

        <!-- コントロールと説明エリア -->
        <div class="flex flex-col md:flex-row gap-6 mt-6">
            <!-- 説明テキスト -->
            <div class="flex-1 bg-white p-6 rounded-2xl shadow-md border border-gray-200 flex flex-col justify-center min-h-[160px]">
                <h2 id="step-title" class="text-xl md:text-2xl font-bold text-blue-600 mb-3">読み込み中...</h2>
                <p id="step-text" class="text-gray-700 text-sm md:text-base leading-relaxed whitespace-pre-wrap"></p>
            </div>

            <!-- ボタン類 -->
            <div class="flex flex-col sm:flex-row md:flex-col gap-3 justify-center shrink-0">
                <button onclick="prevStep()" id="prev-btn" class="w-full sm:w-auto md:w-full px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm text-sm">
                    ＜ 前のステップ
                </button>
                <button onclick="togglePlay()" id="play-btn" class="w-full sm:w-auto md:w-full px-8 py-4 bg-blue-500 text-white font-bold rounded-xl hover:bg-blue-600 active:scale-95 shadow-md transition flex items-center justify-center gap-2">
                    <svg id="icon-play" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg id="icon-pause" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="play-btn-text" class="text-base">再生</span>
                </button>
                <button onclick="nextStep()" id="next-btn" class="w-full sm:w-auto md:w-full px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm text-sm">
                    次のステップ ＞
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // アニメーションステップの定義
        const stepsData = [
            { title: "はじめに", text: "「垂線に垂直な直線を引く」ことで平行線を作図します。\nまずは点Pを通る、直線ℓの垂線（直線m）を引きます。" },
            { title: "ステップ 1 : 直線ℓに垂線を下ろす準備", text: "コンパスの針を点Pに刺し、直線ℓと2か所で交わるように弧を描きます。" },
            { title: "ステップ 2 : 交点から弧を描く", text: "直線ℓ上の2つの交点から、同じ半径で下側に弧を描き、交点を作ります。" },
            { title: "ステップ 3 : 垂線mを引く", text: "点Pと交点を結ぶ直線を引きます。\nこれが直線ℓに垂直な「直線m」になります。" },
            { title: "ステップ 4 : 直線mに垂線を引く準備", text: "次は、点Pを通り直線mに垂直な直線を引きます。\n点Pを中心に、直線mの上下に交点ができるよう弧を描きます。" },
            { title: "ステップ 5 : 交点から弧を描く", text: "直線m上の2つの交点から、同じ半径で右側に弧を描き、交点を作ります。" },
            { title: "ステップ 6 : 平行線を引く", text: "点Pと新しい交点を結ぶ直線を引きます。\n直線mに垂直な直線が引けました。" },
            { title: "完成！", text: "「垂線に垂直な直線」は、元の直線と平行になります！\nこれで直線ℓに平行な直線の完成です。" }
        ];

        let currentStepIndex = 0; 
        let stepProgress = 0; 
        let isPlaying = false;
        let lastTime = 0;

        function updateUI() {
            document.getElementById('step-title').innerText = stepsData[currentStepIndex].title;
            document.getElementById('step-text').innerText = stepsData[currentStepIndex].text;
            
            const btnText = document.getElementById('play-btn-text');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            
            if (isPlaying) {
                btnText.innerText = "一時停止";
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                if (stepProgress >= 1 && currentStepIndex === stepsData.length - 1) {
                    btnText.innerText = "最初から見る";
                } else if (stepProgress >= 1) {
                    btnText.innerText = "次へ再生";
                } else {
                    btnText.innerText = "再生";
                }
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
            
            document.getElementById('prev-btn').disabled = (currentStepIndex === 0 && stepProgress === 0);
            document.getElementById('next-btn').disabled = (currentStepIndex === stepsData.length - 1 && stepProgress >= 1);
        }

        function nextStep() {
            if (currentStepIndex < stepsData.length - 1) {
                currentStepIndex++;
                stepProgress = 0;
                isPlaying = true;
            } else {
                currentStepIndex = 0;
                stepProgress = 0;
                isPlaying = true;
            }
            updateUI();
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                if (stepProgress > 0) {
                    stepProgress = 0;
                    isPlaying = true;
                } else {
                    currentStepIndex--;
                    stepProgress = 0;
                    isPlaying = true;
                }
            }
            updateUI();
        }

        function togglePlay() {
            if (stepProgress >= 1) {
                if (currentStepIndex < stepsData.length - 1) {
                    nextStep();
                } else {
                    currentStepIndex = 0;
                    stepProgress = 0;
                    isPlaying = true;
                }
            } else {
                isPlaying = !isPlaying;
            }
            updateUI();
        }

        function getPhase(progress, start, end) {
            if (progress <= start) return 0;
            if (progress >= end) return 1;
            return (progress - start) / (end - start);
        }

        function drawRuler(ctx, x, y, length, angle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-20, 0, length + 40, 40);
            ctx.strokeRect(-20, 0, length + 40, 40);
            
            ctx.beginPath();
            for(let i = 0; i <= length; i += 10) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i, (i % 50 === 0) ? 15 : 8);
            }
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        function drawCompass(ctx, x, y, radius, drawAngle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(drawAngle);
            
            const hx = radius / 2;
            const hy = -150;
            
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(0, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#9ca3af'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(radius, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#60a5fa'; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 35);
            ctx.lineWidth = 10; ctx.strokeStyle = '#374151'; ctx.stroke();
            
            ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#d1d5db'; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#1f2937'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(radius - 8, -12); ctx.lineTo(radius, 0); ctx.lineTo(radius - 3, -14);
            ctx.fillStyle = '#1f2937'; ctx.fill();
            ctx.restore();
        }

        function drawBackground() {
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        // 座標・定数定義
        const lineY = 450;
        const P = { x: 400, y: 250 };
        
        // Step 1: Pから直線ℓへの弧
        const r1 = 250;
        const dx1 = Math.sqrt(r1*r1 - (lineY - P.y)*(lineY - P.y)); // sqrt(250^2 - 200^2) = 150
        const A = { x: P.x - dx1, y: lineY }; // (250, 450)
        const B = { x: P.x + dx1, y: lineY }; // (550, 450)
        
        // Step 2: A, Bからの弧
        const r2 = 200;
        const dy2 = Math.sqrt(r2*r2 - dx1*dx1); // sqrt(200^2 - 150^2) = 132.3
        const C = { x: P.x, y: lineY + dy2 }; // 交点 (400, 582.3)

        // Step 4: Pから直線mへの弧
        const r3 = 120;
        const D = { x: P.x, y: P.y - r3 }; // (400, 130)
        const E = { x: P.x, y: P.y + r3 }; // (400, 370)

        // Step 5: D, Eからの弧
        const r4 = 150;
        const dx4 = Math.sqrt(r4*r4 - r3*r3); // sqrt(150^2 - 120^2) = 90
        const F = { x: P.x + dx4, y: P.y }; // 交点 (490, 250)

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            let p = { arcP1: 0, arcAB: 0, lineM: 0, arcP2: 0, arcDE: 0, lineParallel: 0, finish: 0 };
            for (let i = 1; i <= 7; i++) {
                let key = Object.keys(p)[i-1];
                if (currentStepIndex > i) p[key] = 1.0;
                else if (currentStepIndex === i) p[key] = stepProgress;
                else p[key] = 0.0;
            }

            // 直線ℓ と 点P
            ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(100, lineY); ctx.lineTo(700, lineY); ctx.stroke();
            ctx.fillStyle = '#1f2937'; ctx.font = "italic 24px serif"; ctx.fillText("ℓ", 680, lineY - 10);
            
            ctx.beginPath(); ctx.arc(P.x, P.y, 4, 0, Math.PI*2); ctx.fill();
            ctx.font = "italic 24px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("P", P.x - 10, P.y - 15);

            // 【ステップ1】 点Pから弧を描く
            if (p.arcP1 > 0) {
                let alpha = getPhase(p.arcP1, 0, 0.1) - getPhase(p.arcP1, 0.9, 1.0);
                let arcT = getPhase(p.arcP1, 0.1, 0.9);
                let start = Math.PI * 0.15; let end = Math.PI * 0.85;
                let current = start + (end - start) * arcT;
                
                ctx.beginPath(); ctx.arc(P.x, P.y, r1, start, current, false);
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                
                if (alpha > 0) drawCompass(ctx, P.x, P.y, r1, current, alpha);
                
                if (p.arcP1 >= 0.9 || currentStepIndex > 1) {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.arc(A.x, A.y, 4, 0, Math.PI*2); ctx.arc(B.x, B.y, 4, 0, Math.PI*2); ctx.fill();
                }
            }

            // 【ステップ2】 A, Bから弧を描く
            if (p.arcAB > 0) {
                let p1 = getPhase(p.arcAB, 0, 0.5); 
                let p2 = getPhase(p.arcAB, 0.5, 1.0); 
                
                if (p1 > 0) {
                    let alpha = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let arcT = getPhase(p1, 0.2, 0.8);
                    let start = Math.PI * 0.1; let end = Math.PI * 0.4;
                    let current = start + (end - start) * arcT;
                    ctx.beginPath(); ctx.arc(A.x, A.y, r2, start, current, false);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, A.x, A.y, r2, current, alpha);
                }
                
                if (p2 > 0) {
                    let alpha = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let arcT = getPhase(p2, 0.2, 0.8);
                    let start = Math.PI * 0.9; let end = Math.PI * 0.6;
                    let current = start + (end - start) * arcT;
                    ctx.beginPath(); ctx.arc(B.x, B.y, r2, start, current, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, B.x, B.y, r2, current, alpha);
                }
                
                if (p2 >= 0.8 || currentStepIndex > 2) {
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(C.x, C.y, 4, 0, Math.PI*2); ctx.fill();
                }
            }

            // 【ステップ3】 直線mを引く
            if (p.lineM > 0) {
                let alpha = getPhase(p.lineM, 0, 0.15) - getPhase(p.lineM, 0.85, 1.0);
                let lineT = getPhase(p.lineM, 0.15, 0.85);
                
                if (alpha > 0) drawRuler(ctx, 400, 100, 500, Math.PI/2, alpha);
                
                ctx.beginPath(); ctx.moveTo(400, 100);
                ctx.lineTo(400, 100 + 500 * lineT);
                ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.stroke();
                
                if (lineT >= 0.8 || currentStepIndex > 3) {
                    ctx.fillStyle = '#1f2937'; ctx.font = "italic 24px serif"; ctx.fillText("m", 410, 130);
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(400, 435); ctx.lineTo(415, 435); ctx.lineTo(415, 450); ctx.stroke();
                }
            }

            // 【ステップ4】 Pから直線mへの弧
            if (p.arcP2 > 0) {
                let alpha = getPhase(p.arcP2, 0, 0.1) - getPhase(p.arcP2, 0.9, 1.0);
                let arcT = getPhase(p.arcP2, 0.1, 0.9);
                let start = -Math.PI * 0.65; let end = Math.PI * 0.65;
                let current = start + (end - start) * arcT;
                
                ctx.beginPath(); ctx.arc(P.x, P.y, r3, start, current, false);
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                
                if (alpha > 0) drawCompass(ctx, P.x, P.y, r3, current, alpha);
                
                if (p.arcP2 >= 0.9 || currentStepIndex > 4) {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.arc(D.x, D.y, 4, 0, Math.PI*2); ctx.arc(E.x, E.y, 4, 0, Math.PI*2); ctx.fill();
                }
            }

            // 【ステップ5】 D, Eから弧を描く
            if (p.arcDE > 0) {
                let p1 = getPhase(p.arcDE, 0, 0.5); 
                let p2 = getPhase(p.arcDE, 0.5, 1.0); 
                
                if (p1 > 0) {
                    let alpha = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let arcT = getPhase(p1, 0.2, 0.8);
                    let start = Math.PI * 0.1; let end = Math.PI * 0.4;
                    let current = start + (end - start) * arcT;
                    ctx.beginPath(); ctx.arc(D.x, D.y, r4, start, current, false);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, D.x, D.y, r4, current, alpha);
                }
                
                if (p2 > 0) {
                    let alpha = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let arcT = getPhase(p2, 0.2, 0.8);
                    let start = -Math.PI * 0.1; let end = -Math.PI * 0.4;
                    let current = start + (end - start) * arcT;
                    ctx.beginPath(); ctx.arc(E.x, E.y, r4, start, current, true);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, E.x, E.y, r4, current, alpha);
                }
                
                if (p2 >= 0.8 || currentStepIndex > 5) {
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(F.x, F.y, 4, 0, Math.PI*2); ctx.fill();
                }
            }

            // 【ステップ6】 平行線を引く
            if (p.lineParallel > 0) {
                let alpha = getPhase(p.lineParallel, 0, 0.15) - getPhase(p.lineParallel, 0.85, 1.0);
                let lineT = getPhase(p.lineParallel, 0.15, 0.85);
                
                if (alpha > 0) drawRuler(ctx, 100, 250, 600, 0, alpha);
                
                ctx.beginPath(); ctx.moveTo(100, 250);
                ctx.lineTo(100 + 600 * lineT, 250);
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
            }

            // 【ステップ7】 完成
            if (p.finish > 0) {
                ctx.globalAlpha = p.finish;
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(400, 235); ctx.lineTo(415, 235); ctx.lineTo(415, 250); ctx.stroke();
                
                // 平行記号（矢印）
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.moveTo(250, 450); ctx.lineTo(235, 440); ctx.lineTo(235, 460); ctx.fill();
                ctx.beginPath(); ctx.moveTo(250, 250); ctx.lineTo(235, 240); ctx.lineTo(235, 260); ctx.fill();
                
                ctx.globalAlpha = 1;
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (isPlaying) {
                let duration = 2500;
                if (currentStepIndex === 1) duration = 2500;
                if (currentStepIndex === 2) duration = 3000;
                if (currentStepIndex === 3) duration = 2000;
                if (currentStepIndex === 4) duration = 2500;
                if (currentStepIndex === 5) duration = 3000; 
                if (currentStepIndex === 6) duration = 2000;

                if (currentStepIndex > 0) {
                    stepProgress += dt / duration;
                    if (stepProgress >= 1.0) {
                        stepProgress = 1.0;
                        isPlaying = false;
                    }
                }
                updateUI();
            }

            drawScene();
            requestAnimationFrame(loop);
        }

        window.onload = () => {
            updateUI();
            requestAnimationFrame(loop);
        };
    </script>
</body>
</html>
