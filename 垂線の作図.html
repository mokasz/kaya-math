<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垂線の作図</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f3f4f6;
        }
        canvas {
            touch-action: none; /* スマホでのスクロール誤作動防止 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-8 px-4">

    <div class="w-full max-w-4xl">
        <!-- ヘッダー -->
        <div class="text-center mb-4">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">📐 垂線の作図</h1>
            <p class="text-gray-600">2つのパターンの作図方法をマスターしよう！</p>
        </div>

        <!-- タブ切り替え -->
        <div class="flex justify-center mb-6">
            <div class="bg-gray-200 p-1 rounded-xl flex gap-1">
                <button onclick="setMode(1)" id="tab-mode-1" class="px-6 py-2 rounded-lg font-bold transition-colors bg-white text-blue-600 shadow-sm">
                    パターン①：直線外の点から
                </button>
                <button onclick="setMode(2)" id="tab-mode-2" class="px-6 py-2 rounded-lg font-bold transition-colors text-gray-600 hover:bg-gray-300">
                    パターン②：直線上の点から
                </button>
            </div>
        </div>

        <!-- キャンバスエリア -->
        <div class="w-full bg-white p-2 rounded-2xl shadow-xl border border-gray-200">
            <!-- キャンバスの解像度は800x600 -->
            <canvas id="simCanvas" width="800" height="600" class="w-full h-auto rounded-xl bg-slate-50 block"></canvas>
        </div>

        <!-- コントロールと説明エリア -->
        <div class="flex flex-col md:flex-row gap-6 mt-6">
            <!-- 説明テキスト -->
            <div class="flex-1 bg-white p-6 rounded-2xl shadow-md border border-gray-200 flex flex-col justify-center min-h-[160px]">
                <h2 id="step-title" class="text-2xl font-bold text-blue-600 mb-3">読み込み中...</h2>
                <p id="step-text" class="text-gray-700 text-lg leading-relaxed whitespace-pre-wrap"></p>
            </div>

            <!-- ボタン類 -->
            <div class="flex flex-col sm:flex-row md:flex-col gap-3 justify-center shrink-0">
                <button onclick="prevStep()" id="prev-btn" class="w-full sm:w-auto md:w-full px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm">
                    ＜ 前のステップ
                </button>
                <button onclick="togglePlay()" id="play-btn" class="w-full sm:w-auto md:w-full px-8 py-4 bg-blue-500 text-white font-bold rounded-xl hover:bg-blue-600 active:scale-95 shadow-md transition flex items-center justify-center gap-2">
                    <svg id="icon-play" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg id="icon-pause" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="play-btn-text">再生</span>
                </button>
                <button onclick="nextStep()" id="next-btn" class="w-full sm:w-auto md:w-full px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm">
                    次のステップ ＞
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // アニメーションステップの定義：パターン1（直線外の点）
        const stepsData1 = [
            { title: "パターン①：はじめに", text: "直線上にない「点P」を通る、直線の垂線を引いてみましょう！\n「再生」を押してスタートしてね。" },
            { title: "ステップ 1 : 点Pから弧を描く", text: "コンパスの針を点Pに刺します。\n直線と2つの場所で交わるように、適当な長さで弧を描きます。" },
            { title: "ステップ 2 : 交点に印をつける", text: "直線と弧が交わった2つの場所に印をつけます。\n左を点A、右を点Bとします。" },
            { title: "ステップ 3 : 点Aから弧を描く", text: "コンパスの針を点Aに刺します。（開き具合はABの半分以上にします）\n点Pの反対側（下側）に弧を描きます。" },
            { title: "ステップ 4 : 点Bから弧を描く", text: "コンパスの開き具合を変えずに、針を点Bに刺します。\n先ほど描いた弧と交差するように弧を描きます。交点をQとします。" },
            { title: "ステップ 5 : 2点を直線で結ぶ", text: "定規を使って、点Pと点Qを通る直線をスーッと引きます。" },
            { title: "完成！", text: "これで「点Pを通る垂線」の完成です！\n元の直線と直角（90度）に交わっています。" }
        ];

        // アニメーションステップの定義：パターン2（直線上の点）
        const stepsData2 = [
            { title: "パターン②：はじめに", text: "直線上にある「点P」を通る、直線の垂線を引いてみましょう！\n「再生」を押してスタートしてね。" },
            { title: "ステップ 1 : 点Pから弧を描く", text: "コンパスの針を点Pに刺します。\n点Pをはさんで、直線の左右に交点ができるように弧を描きます。" },
            { title: "ステップ 2 : 交点に印をつける", text: "直線と弧が交わった2つの場所に印をつけます。\n左を点A、右を点Bとします。（PA = PBになります）" },
            { title: "ステップ 3 : 点Aから弧を描く", text: "コンパスの針を点Aに刺します。（開き具合は少し広げます）\n直線の上側に弧を描きます。" },
            { title: "ステップ 4 : 点Bから弧を描く", text: "コンパスの開き具合を変えずに、針を点Bに刺します。\n先ほど描いた弧と交差するように弧を描きます。交点をQとします。" },
            { title: "ステップ 5 : 2点を直線で結ぶ", text: "定規を使って、点Pと点Qを通る直線を引きます。" },
            { title: "完成！", text: "これで「点Pを通る垂線」の完成です！\n直線上の点Pで、直角（90度）に交わっています。" }
        ];

        // 状態管理
        let currentMode = 1; // 1 or 2
        let stepsData = stepsData1;
        let currentStepIndex = 0; 
        let stepProgress = 0; // 0.0 ~ 1.0
        let isPlaying = false;
        let lastTime = 0;

        // モード切替
        function setMode(mode) {
            currentMode = mode;
            stepsData = mode === 1 ? stepsData1 : stepsData2;
            currentStepIndex = 0;
            stepProgress = 0;
            isPlaying = false;
            
            // タブの見た目更新
            const tab1 = document.getElementById('tab-mode-1');
            const tab2 = document.getElementById('tab-mode-2');
            if (mode === 1) {
                tab1.className = "px-6 py-2 rounded-lg font-bold transition-colors bg-white text-blue-600 shadow-sm";
                tab2.className = "px-6 py-2 rounded-lg font-bold transition-colors text-gray-600 hover:bg-gray-300";
            } else {
                tab2.className = "px-6 py-2 rounded-lg font-bold transition-colors bg-white text-blue-600 shadow-sm";
                tab1.className = "px-6 py-2 rounded-lg font-bold transition-colors text-gray-600 hover:bg-gray-300";
            }
            
            updateUI();
            drawScene(); // 即座に再描画
        }

        // UIの更新
        function updateUI() {
            document.getElementById('step-title').innerText = stepsData[currentStepIndex].title;
            document.getElementById('step-text').innerText = stepsData[currentStepIndex].text;
            
            const btnText = document.getElementById('play-btn-text');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            
            if (isPlaying) {
                btnText.innerText = "一時停止";
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                if (stepProgress >= 1 && currentStepIndex === stepsData.length - 1) {
                    btnText.innerText = "最初から見る";
                } else if (stepProgress >= 1) {
                    btnText.innerText = "次へ再生";
                } else {
                    btnText.innerText = "再生";
                }
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
            
            document.getElementById('prev-btn').disabled = (currentStepIndex === 0 && stepProgress === 0);
            document.getElementById('next-btn').disabled = (currentStepIndex === stepsData.length - 1 && stepProgress >= 1);
        }

        // コントロール関数
        function nextStep() {
            if (currentStepIndex < stepsData.length - 1) {
                currentStepIndex++;
                stepProgress = 0;
                isPlaying = true;
            } else {
                currentStepIndex = 0;
                stepProgress = 0;
                isPlaying = true;
            }
            updateUI();
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                if (stepProgress > 0) {
                    stepProgress = 0;
                    isPlaying = true;
                } else {
                    currentStepIndex--;
                    stepProgress = 0;
                    isPlaying = true;
                }
            }
            updateUI();
        }

        function togglePlay() {
            if (stepProgress >= 1) {
                if (currentStepIndex < stepsData.length - 1) {
                    nextStep();
                } else {
                    currentStepIndex = 0;
                    stepProgress = 0;
                    isPlaying = true;
                }
            } else {
                isPlaying = !isPlaying;
            }
            updateUI();
        }

        function getPhase(progress, start, end) {
            if (progress <= start) return 0;
            if (progress >= end) return 1;
            return (progress - start) / (end - start);
        }

        // 定規とコンパスの描画関数（再利用）
        function drawRuler(ctx, x, y, length, angle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-20, 0, length + 40, 40);
            ctx.strokeRect(-20, 0, length + 40, 40);
            
            ctx.beginPath();
            for(let i = 0; i <= length; i += 10) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i, (i % 50 === 0) ? 15 : 8);
            }
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            ctx.restore();
        }

        function drawCompass(ctx, x, y, radius, drawAngle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(drawAngle);
            
            const hx = radius / 2;
            const hy = -150;
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(0, 0); 
            ctx.lineWidth = 6; ctx.strokeStyle = '#9ca3af'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(radius, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#60a5fa'; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 35);
            ctx.lineWidth = 10; ctx.strokeStyle = '#374151'; ctx.stroke();
            
            ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#d1d5db'; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#1f2937'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(radius - 8, -12); ctx.lineTo(radius, 0); ctx.lineTo(radius - 3, -14);
            ctx.fillStyle = '#1f2937'; ctx.fill();
            
            ctx.restore();
        }

        function drawBackground() {
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        // 描画メイン
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            let p = { arc1: 0, points: 0, arcA: 0, arcB: 0, line: 0, finish: 0 };
            for (let i = 1; i <= 6; i++) {
                let key = ['arc1', 'points', 'arcA', 'arcB', 'line', 'finish'][i-1];
                if (currentStepIndex > i) p[key] = 1.0;
                else if (currentStepIndex === i) p[key] = stepProgress;
                else p[key] = 0.0;
            }

            if (currentMode === 1) {
                // =============== パターン1（直線外の点） ===============
                const lineY = 350;
                const P = { x: 400, y: 150 };
                const r1 = 250; 
                // A, Bは直線 y=350 との交点。dx = sqrt(250^2 - 200^2) = 150
                const A = { x: 250, y: 350 };
                const B = { x: 550, y: 350 };
                const r2 = 250;
                // QはA,Bから半径250。dy = sqrt(250^2 - 150^2) = 200。y = 350 + 200 = 550
                const Q = { x: 400, y: 550 };

                // 基準となる直線と点P
                ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(100, lineY); ctx.lineTo(700, lineY); ctx.stroke();
                
                ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(P.x, P.y, 5, 0, Math.PI*2); ctx.fill();
                ctx.font = "italic 24px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("P", P.x - 30, P.y + 8);

                // ステップ1：点Pから弧
                if (p.arc1 > 0) {
                    let alpha = getPhase(p.arc1, 0, 0.1) - getPhase(p.arc1, 0.9, 1.0);
                    let arcT = getPhase(p.arc1, 0.1, 0.9);
                    let startA = Math.PI * 0.2; let endA = Math.PI * 0.8;
                    let currentA = startA + (endA - startA) * arcT;
                    
                    ctx.beginPath(); ctx.arc(P.x, P.y, r1, startA, currentA, false);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, P.x, P.y, r1, currentA, alpha);
                }

                // ステップ2：交点A, B
                if (p.points > 0) {
                    ctx.globalAlpha = p.points;
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.arc(A.x, A.y, 5, 0, Math.PI*2); ctx.arc(B.x, B.y, 5, 0, Math.PI*2); ctx.fill();
                    ctx.font = "bold 22px 'M PLUS Rounded 1c', sans-serif";
                    ctx.fillText("A", A.x - 20, A.y - 15); ctx.fillText("B", B.x + 10, B.y - 15);
                    ctx.globalAlpha = 1;
                }

                // ステップ3：点Aから弧
                if (p.arcA > 0) {
                    let alpha = getPhase(p.arcA, 0, 0.1) - getPhase(p.arcA, 0.9, 1.0);
                    let arcT = getPhase(p.arcA, 0.1, 0.9);
                    let startA = Math.PI * 0.1; let endA = Math.PI * 0.4;
                    let currentA = startA + (endA - startA) * arcT;
                    
                    ctx.beginPath(); ctx.arc(A.x, A.y, r2, startA, currentA, false);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, A.x, A.y, r2, currentA, alpha);
                }

                // ステップ4：点Bから弧
                if (p.arcB > 0) {
                    let alpha = getPhase(p.arcB, 0, 0.1) - getPhase(p.arcB, 0.9, 1.0);
                    let arcT = getPhase(p.arcB, 0.1, 0.9);
                    let startA = Math.PI * 0.9; let endA = Math.PI * 0.6;
                    let currentA = startA + (endA - startA) * arcT;
                    
                    ctx.beginPath(); ctx.arc(B.x, B.y, r2, startA, currentA, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, B.x, B.y, r2, currentA, alpha);
                }

                // 交点Q (ステップ4完了時以降)
                if (currentStepIndex >= 4) {
                    ctx.globalAlpha = (currentStepIndex === 4) ? p.arcB : 1;
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(Q.x, Q.y, 5, 0, Math.PI*2); ctx.fill();
                    ctx.font = "bold 22px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("Q", Q.x + 15, Q.y + 10);
                    ctx.globalAlpha = 1;
                }

                // ステップ5：垂線を引く
                if (p.line > 0) {
                    let alpha = getPhase(p.line, 0, 0.15) - getPhase(p.line, 0.85, 1.0);
                    let lineT = getPhase(p.line, 0.15, 0.85);
                    
                    if (alpha > 0) drawRuler(ctx, P.x, 80, 500, Math.PI / 2, alpha); // 定規を縦に
                    
                    ctx.beginPath(); ctx.moveTo(P.x, 80); ctx.lineTo(P.x, 80 + 500 * lineT);
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
                }

                // ステップ6：直角マーク
                if (p.finish > 0) {
                    ctx.globalAlpha = p.finish;
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(400, 335); ctx.lineTo(415, 335); ctx.lineTo(415, 350); ctx.stroke();
                    ctx.globalAlpha = 1;
                }

            } else {
                // =============== パターン2（直線上の点） ===============
                const lineY = 450;
                const P = { x: 400, y: 450 };
                const r1 = 150; 
                const A = { x: 250, y: 450 };
                const B = { x: 550, y: 450 };
                const r2 = 250;
                // QはA,Bから半径250。上側 dy = 200。y = 450 - 200 = 250
                const Q = { x: 400, y: 250 };

                // 基準となる直線と点P
                ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(100, lineY); ctx.lineTo(700, lineY); ctx.stroke();
                
                ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(P.x, P.y, 5, 0, Math.PI*2); ctx.fill();
                ctx.font = "italic 24px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("P", P.x + 10, P.y + 25);

                // ステップ1：点Pから弧（半円を描く）
                if (p.arc1 > 0) {
                    let alpha = getPhase(p.arc1, 0, 0.1) - getPhase(p.arc1, 0.9, 1.0);
                    let arcT = getPhase(p.arc1, 0.1, 0.9);
                    let startA = 0; let endA = -Math.PI; // 上半分
                    let currentA = startA + (endA - startA) * arcT;
                    
                    ctx.beginPath(); ctx.arc(P.x, P.y, r1, startA, currentA, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, P.x, P.y, r1, currentA, alpha);
                }

                // ステップ2：交点A, B
                if (p.points > 0) {
                    ctx.globalAlpha = p.points;
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.arc(A.x, A.y, 5, 0, Math.PI*2); ctx.arc(B.x, B.y, 5, 0, Math.PI*2); ctx.fill();
                    ctx.font = "bold 22px 'M PLUS Rounded 1c', sans-serif";
                    ctx.fillText("A", A.x - 25, A.y + 25); ctx.fillText("B", B.x + 10, B.y + 25);
                    ctx.globalAlpha = 1;
                }

                // ステップ3：点Aから弧
                if (p.arcA > 0) {
                    let alpha = getPhase(p.arcA, 0, 0.1) - getPhase(p.arcA, 0.9, 1.0);
                    let arcT = getPhase(p.arcA, 0.1, 0.9);
                    let startA = -Math.PI * 0.1; let endA = -Math.PI * 0.4;
                    let currentA = startA + (endA - startA) * arcT;
                    
                    ctx.beginPath(); ctx.arc(A.x, A.y, r2, startA, currentA, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, A.x, A.y, r2, currentA, alpha);
                }

                // ステップ4：点Bから弧
                if (p.arcB > 0) {
                    let alpha = getPhase(p.arcB, 0, 0.1) - getPhase(p.arcB, 0.9, 1.0);
                    let arcT = getPhase(p.arcB, 0.1, 0.9);
                    let startA = -Math.PI * 0.9; let endA = -Math.PI * 0.6;
                    let currentA = startA + (endA - startA) * arcT;
                    
                    ctx.beginPath(); ctx.arc(B.x, B.y, r2, startA, currentA, false);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, B.x, B.y, r2, currentA, alpha);
                }

                // 交点Q
                if (currentStepIndex >= 4) {
                    ctx.globalAlpha = (currentStepIndex === 4) ? p.arcB : 1;
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(Q.x, Q.y, 5, 0, Math.PI*2); ctx.fill();
                    ctx.font = "bold 22px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("Q", Q.x + 15, Q.y - 10);
                    ctx.globalAlpha = 1;
                }

                // ステップ5：垂線を引く
                if (p.line > 0) {
                    let alpha = getPhase(p.line, 0, 0.15) - getPhase(p.line, 0.85, 1.0);
                    let lineT = getPhase(p.line, 0.15, 0.85);
                    
                    if (alpha > 0) drawRuler(ctx, P.x, 150, 350, Math.PI / 2, alpha); // 定規を縦に
                    
                    ctx.beginPath(); ctx.moveTo(P.x, 150); ctx.lineTo(P.x, 150 + 350 * lineT);
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
                }

                // ステップ6：直角マーク
                if (p.finish > 0) {
                    ctx.globalAlpha = p.finish;
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(400, 435); ctx.lineTo(415, 435); ctx.lineTo(415, 450); ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            }
        }

        // アニメーションループ
        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (isPlaying) {
                let duration = 2500;
                if (currentStepIndex === 1) duration = 2500;
                if (currentStepIndex === 2) duration = 1500;
                if (currentStepIndex === 3 || currentStepIndex === 4) duration = 2500;
                if (currentStepIndex === 5) duration = 2500;
                if (currentStepIndex === 6) duration = 2000;

                if (currentStepIndex > 0) {
                    stepProgress += dt / duration;
                    if (stepProgress >= 1.0) {
                        stepProgress = 1.0;
                        isPlaying = false;
                    }
                }
                updateUI();
            }

            drawScene();
            requestAnimationFrame(loop);
        }

        // 初期化処理
        window.onload = () => {
            setMode(1); // 初期状態をパターン1に
            requestAnimationFrame(loop);
        };
    </script>
</body>
</html>
