<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>75°の角の作図</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f3f4f6;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-6 px-4">

    <div class="w-full max-w-4xl">
        <!-- ヘッダー -->
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">📐 75°の角の作図</h1>
            <p class="text-sm md:text-base text-gray-600">60°と90°を作図し、その間を「角の二等分線」で分けて75°を作ろう！</p>
        </div>

        <!-- キャンバスエリア -->
        <div class="w-full bg-white p-2 rounded-2xl shadow-xl border border-gray-200 flex justify-center">
            <canvas id="simCanvas" width="800" height="600" class="w-full max-h-[50vh] object-contain rounded-xl bg-slate-50 block"></canvas>
        </div>

        <!-- コントロールと説明エリア -->
        <div class="flex flex-col md:flex-row gap-4 mt-6">
            <!-- 説明テキスト -->
            <div class="flex-1 bg-white p-4 rounded-2xl shadow-md border border-gray-200 flex flex-col justify-center min-h-[140px]">
                <h2 id="step-title" class="text-xl md:text-2xl font-bold text-blue-600 mb-2">読み込み中...</h2>
                <p id="step-text" class="text-gray-700 text-sm md:text-base leading-relaxed whitespace-pre-wrap"></p>
            </div>

            <!-- ボタン類 -->
            <div class="flex flex-col sm:flex-row md:flex-col gap-2 justify-center shrink-0">
                <button onclick="prevStep()" id="prev-btn" class="w-full sm:w-auto md:w-full px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm text-sm">
                    ＜ 前のステップ
                </button>
                <button onclick="togglePlay()" id="play-btn" class="w-full sm:w-auto md:w-full px-6 py-3 bg-blue-500 text-white font-bold rounded-xl hover:bg-blue-600 active:scale-95 shadow-md transition flex items-center justify-center gap-2">
                    <svg id="icon-play" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg id="icon-pause" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="play-btn-text" class="text-base">再生</span>
                </button>
                <button onclick="nextStep()" id="next-btn" class="w-full sm:w-auto md:w-full px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm text-sm">
                    次のステップ ＞
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const stepsData = [
            { title: "はじめに", text: "75°の角は、60°の角と90°の角の間の30°を二等分して（60°＋15°＝75°）作図します。\nまずは60°と90°の基準を作りましょう。" },
            { title: "ステップ 1 : 点Aから弧を描く", text: "点Aにコンパスの針を刺し、長めの弧を描きます。\n線分ABとの交点をPとします。" },
            { title: "ステップ 2 : 60°と120°の目印をつける", text: "コンパスの開きを変えずに、点Pから弧を描いて交点Q（60°）を作り、\nさらに点Qから弧を描いて交点R（120°）を作ります。" },
            { title: "ステップ 3 : 90°の垂線を引く", text: "点Qと点Rからそれぞれ弧を描いて交点を作り、点Aから直線を引くと90°（垂線）になります。\nこの線と最初の弧との交点をTとします。" },
            { title: "ステップ 4 : 角の二等分線の準備", text: "60°(点Q)と90°(点T)の間の角を二等分します。\n点Qと点Tから同じ半径でそれぞれ弧を描き、交点Uを作ります。" },
            { title: "ステップ 5 : 75°の直線を引く", text: "定規を使って、点Aから交点Uを通る直線を引きます。" },
            { title: "完成！", text: "直線上の適当なところに点Cをとれば、∠BAC = 75°の完成です！\n60°と90°の間を半分にすることで75°が作れました。" }
        ];

        let currentStepIndex = 0; 
        let stepProgress = 0; 
        let isPlaying = false;
        let lastTime = 0;

        function updateUI() {
            document.getElementById('step-title').innerText = stepsData[currentStepIndex].title;
            document.getElementById('step-text').innerText = stepsData[currentStepIndex].text;
            
            const btnText = document.getElementById('play-btn-text');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            
            if (isPlaying) {
                btnText.innerText = "一時停止";
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                if (stepProgress >= 1 && currentStepIndex === stepsData.length - 1) {
                    btnText.innerText = "最初から見る";
                } else if (stepProgress >= 1) {
                    btnText.innerText = "次へ再生";
                } else {
                    btnText.innerText = "再生";
                }
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
            
            document.getElementById('prev-btn').disabled = (currentStepIndex === 0 && stepProgress === 0);
            document.getElementById('next-btn').disabled = (currentStepIndex === stepsData.length - 1 && stepProgress >= 1);
        }

        function nextStep() {
            if (currentStepIndex < stepsData.length - 1) {
                currentStepIndex++;
                stepProgress = 0;
                isPlaying = true;
            } else {
                currentStepIndex = 0;
                stepProgress = 0;
                isPlaying = true;
            }
            updateUI();
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                if (stepProgress > 0) {
                    stepProgress = 0;
                    isPlaying = true;
                } else {
                    currentStepIndex--;
                    stepProgress = 0;
                    isPlaying = true;
                }
            }
            updateUI();
        }

        function togglePlay() {
            if (stepProgress >= 1) {
                if (currentStepIndex < stepsData.length - 1) {
                    nextStep();
                } else {
                    currentStepIndex = 0;
                    stepProgress = 0;
                    isPlaying = true;
                }
            } else {
                isPlaying = !isPlaying;
            }
            updateUI();
        }

        function getPhase(progress, start, end) {
            if (progress <= start) return 0;
            if (progress >= end) return 1;
            return (progress - start) / (end - start);
        }

        function drawRuler(ctx, x, y, length, angle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-20, 0, length + 40, 40);
            ctx.strokeRect(-20, 0, length + 40, 40);
            
            ctx.beginPath();
            for(let i = 0; i <= length; i += 10) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i, (i % 50 === 0) ? 15 : 8);
            }
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        function drawCompass(ctx, x, y, radius, drawAngle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(drawAngle);
            
            const hx = radius / 2;
            const hy = -150;
            
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(0, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#9ca3af'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(radius, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#60a5fa'; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 35);
            ctx.lineWidth = 10; ctx.strokeStyle = '#374151'; ctx.stroke();
            
            ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#d1d5db'; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#1f2937'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(radius - 8, -12); ctx.lineTo(radius, 0); ctx.lineTo(radius - 3, -14);
            ctx.fillStyle = '#1f2937'; ctx.fill();
            ctx.restore();
        }

        function drawBackground() {
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        // 座標・定数定義
        const A = { x: 300, y: 480 };
        const B = { x: 700, y: 480 };
        
        // ステップ1
        const r1 = 200;
        const P = { x: A.x + r1, y: A.y };
        
        // ステップ2 (60°, 120°)
        const angle60 = -60 * Math.PI / 180;
        const angle120 = -120 * Math.PI / 180;
        const Q = { x: A.x + r1 * Math.cos(angle60), y: A.y + r1 * Math.sin(angle60) };
        const R = { x: A.x + r1 * Math.cos(angle120), y: A.y + r1 * Math.sin(angle120) };
        
        // ステップ3 (90°)
        // Q, Rからの弧の交点S (xは同じ, yは A.y - r1*sqrt(3))
        const S = { x: A.x, y: A.y - r1 * Math.sqrt(3) };
        const angle90 = -90 * Math.PI / 180;
        const T = { x: A.x, y: A.y - r1 }; // 90°と最初の弧の交点
        
        // ステップ4 (60°と90°の二等分線 = 75°)
        const r2 = 160; // 二等分線を描くための半径
        const angle75 = -75 * Math.PI / 180;
        // 交点Uの正確な位置を幾何的に計算
        const distAU = 200 * Math.cos(15 * Math.PI/180) + Math.sqrt(r2*r2 - Math.pow(200*Math.sin(15 * Math.PI/180), 2));
        const U = { x: A.x + distAU * Math.cos(angle75), y: A.y + distAU * Math.sin(angle75) };

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            // ベースの線分AB
            ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(150, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
            
            ctx.fillStyle = '#1f2937'; ctx.font = "italic 24px 'M PLUS Rounded 1c', sans-serif";
            ctx.beginPath(); ctx.arc(A.x, A.y, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillText("A", A.x - 25, A.y + 25);
            ctx.beginPath(); ctx.arc(B.x, B.y, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillText("B", B.x + 10, B.y + 25);

            let p = { arcA: 0, arcQR: 0, prep90: 0, prepBisect: 0, line75: 0, finish: 0 };
            for (let i = 1; i <= 6; i++) {
                let key = Object.keys(p)[i-1];
                if (currentStepIndex > i) p[key] = 1.0;
                else if (currentStepIndex === i) p[key] = stepProgress;
                else p[key] = 0.0;
            }

            // 【ステップ1】 点Aから弧
            if (p.arcA > 0) {
                let alpha = getPhase(p.arcA, 0, 0.1) - getPhase(p.arcA, 0.9, 1.0);
                let arcT = getPhase(p.arcA, 0.1, 0.9);
                let start = 10 * Math.PI/180; let end = -140 * Math.PI/180;
                let current = start + (end - start) * arcT;
                
                ctx.beginPath(); ctx.arc(A.x, A.y, r1, start, current, true);
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                if (alpha > 0) drawCompass(ctx, A.x, A.y, r1, current, alpha);
                
                if (p.arcA >= 0.9 || currentStepIndex > 1) {
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(P.x, P.y, 5, 0, Math.PI*2); ctx.fill();
                    ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("P", P.x + 10, P.y + 25);
                }
            }

            // 【ステップ2】 点P, Qから弧
            if (p.arcQR > 0) {
                let p1 = getPhase(p.arcQR, 0, 0.5); // Qを作る
                let p2 = getPhase(p.arcQR, 0.5, 1.0); // Rを作る
                
                if (p1 > 0) {
                    let alpha = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let arcT = getPhase(p1, 0.2, 0.8);
                    let start = -100 * Math.PI/180; let end = -140 * Math.PI/180;
                    let current = start + (end - start) * arcT;
                    ctx.beginPath(); ctx.arc(P.x, P.y, r1, start, current, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, P.x, P.y, r1, current, alpha);
                    
                    if (p1 >= 0.8 || currentStepIndex > 2) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(Q.x, Q.y, 5, 0, Math.PI*2); ctx.fill();
                        ctx.fillText("Q", Q.x + 15, Q.y + 10);
                        // 60度補助線
                        ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(Q.x, Q.y);
                        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                    }
                }
                
                if (p2 > 0) {
                    let alpha = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let arcT = getPhase(p2, 0.2, 0.8);
                    let start = -160 * Math.PI/180; let end = -200 * Math.PI/180;
                    let current = start + (end - start) * arcT;
                    ctx.beginPath(); ctx.arc(Q.x, Q.y, r1, start, current, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, Q.x, Q.y, r1, current, alpha);
                    
                    if (p2 >= 0.8 || currentStepIndex > 2) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(R.x, R.y, 5, 0, Math.PI*2); ctx.fill();
                        ctx.fillText("R", R.x - 20, R.y - 10);
                    }
                }
            }

            // 【ステップ3】 90°の作図
            if (p.prep90 > 0) {
                let p1 = getPhase(p.prep90, 0, 0.4); // Qから
                let p2 = getPhase(p.prep90, 0.4, 0.8); // Rから
                let p3 = getPhase(p.prep90, 0.8, 1.0); // 垂線
                
                if (p1 > 0) {
                    let arcT = getPhase(p1, 0.2, 0.8);
                    let s = -100 * Math.PI/180; let c = s - 40 * Math.PI/180 * arcT;
                    ctx.beginPath(); ctx.arc(Q.x, Q.y, r1, s, c, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                }
                if (p2 > 0) {
                    let arcT = getPhase(p2, 0.2, 0.8);
                    let s = -80 * Math.PI/180; let c = s + 40 * Math.PI/180 * arcT;
                    ctx.beginPath(); ctx.arc(R.x, R.y, r1, s, c, false);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                }
                if (p3 > 0) {
                    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(A.x, A.y - 400 * p3);
                    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
                    
                    if (p3 >= 0.9 || currentStepIndex > 3) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(T.x, T.y, 5, 0, Math.PI*2); ctx.fill();
                        ctx.fillText("T", T.x - 25, T.y + 10);
                        // 直角マーク
                        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(A.x + 15, A.y); ctx.lineTo(A.x + 15, A.y - 15); ctx.lineTo(A.x, A.y - 15); ctx.stroke();
                    }
                }
            }

            // 【ステップ4】 60°と90°の二等分線 (30°を半分にする)
            if (p.prepBisect > 0) {
                let p1 = getPhase(p.prepBisect, 0, 0.5); // Qから
                let p2 = getPhase(p.prepBisect, 0.5, 1.0); // Tから
                
                let angleQU = Math.atan2(U.y - Q.y, U.x - Q.x);
                let angleTU = Math.atan2(U.y - T.y, U.x - T.x);

                if (p1 > 0) {
                    let alpha = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let arcT = getPhase(p1, 0.2, 0.8);
                    let s = angleQU + 0.4; let e = angleQU - 0.4;
                    let c = s + (e - s) * arcT;
                    ctx.beginPath(); ctx.arc(Q.x, Q.y, r2, s, c, true);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, Q.x, Q.y, r2, c, alpha);
                }
                
                if (p2 > 0) {
                    let alpha = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let arcT = getPhase(p2, 0.2, 0.8);
                    let s = angleTU - 0.4; let e = angleTU + 0.4;
                    let c = s + (e - s) * arcT;
                    ctx.beginPath(); ctx.arc(T.x, T.y, r2, s, c, false);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, T.x, T.y, r2, c, alpha);
                    
                    if (p2 >= 0.9 || currentStepIndex > 4) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(U.x, U.y, 5, 0, Math.PI*2); ctx.fill();
                        ctx.fillText("U", U.x + 15, U.y - 10);
                    }
                }
            }

            // 【ステップ5】 75°の直線を引く
            if (p.line75 > 0) {
                let alpha = getPhase(p.line75, 0, 0.15) - getPhase(p.line75, 0.85, 1.0);
                let lineT = getPhase(p.line75, 0.15, 0.85);
                
                if (alpha > 0) drawRuler(ctx, A.x, A.y, 400, angle75, alpha);
                
                ctx.beginPath(); ctx.moveTo(A.x, A.y);
                let endX = A.x + 400 * lineT * Math.cos(angle75);
                let endY = A.y + 400 * lineT * Math.sin(angle75);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
                
                if (lineT >= 0.9 || currentStepIndex > 5) {
                    ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(A.x + 300 * Math.cos(angle75), A.y + 300 * Math.sin(angle75), 4, 0, Math.PI*2); ctx.fill();
                    ctx.fillText("C", A.x + 300 * Math.cos(angle75) - 20, A.y + 300 * Math.sin(angle75) - 15);
                }
            }

            // 【ステップ6】 完成
            if (p.finish > 0) {
                ctx.globalAlpha = p.finish;
                // 75°マーク
                ctx.beginPath(); ctx.arc(A.x, A.y, 50, 0, angle75, true);
                ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#ef4444'; ctx.font = "bold 20px sans-serif"; ctx.fillText("75°", A.x + 60, A.y - 25);
                ctx.globalAlpha = 1;
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (isPlaying) {
                let duration = 2500;
                if (currentStepIndex === 1) duration = 2000;
                if (currentStepIndex === 2) duration = 3500;
                if (currentStepIndex === 3) duration = 3000;
                if (currentStepIndex === 4) duration = 3500;
                if (currentStepIndex === 5) duration = 2000;
                if (currentStepIndex === 6) duration = 1500;

                if (currentStepIndex > 0) {
                    stepProgress += dt / duration;
                    if (stepProgress >= 1.0) {
                        stepProgress = 1.0;
                        isPlaying = false;
                    }
                }
                updateUI();
            }

            drawScene();
            requestAnimationFrame(loop);
        }

        window.onload = () => {
            updateUI();
            requestAnimationFrame(loop);
        };
    </script>
</body>
</html>
