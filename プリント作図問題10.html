<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2辺に接する3つの円の作図</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f3f4f6;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-2 px-4">

    <div class="w-full max-w-3xl">
        <!-- ヘッダー -->
        <div class="text-center mb-3">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-1">📐 2辺に接する円の作図</h1>
            <p class="text-sm md:text-base text-gray-600">「角の二等分線」と「垂線」を利用して、2辺に接する円を作図しよう！</p>
        </div>

        <!-- キャンバスエリア -->
        <div class="w-full bg-white p-2 rounded-2xl shadow-xl border border-gray-200 flex justify-center">
            <canvas id="simCanvas" width="800" height="600" class="w-full max-h-[45vh] object-contain rounded-xl bg-slate-50 block"></canvas>
        </div>

        <!-- コントロールと説明エリア -->
        <div class="flex flex-col md:flex-row gap-4 mt-4">
            <!-- 説明テキスト -->
            <div class="flex-1 bg-white p-4 rounded-2xl shadow-md border border-gray-200 flex flex-col justify-center min-h-[120px]">
                <h2 id="step-title" class="text-xl md:text-2xl font-bold text-blue-600 mb-2">読み込み中...</h2>
                <p id="step-text" class="text-gray-700 text-sm md:text-base leading-relaxed whitespace-pre-wrap"></p>
            </div>

            <!-- ボタン類 -->
            <div class="flex flex-col sm:flex-row md:flex-col gap-2 justify-center shrink-0">
                <button onclick="prevStep()" id="prev-btn" class="w-full sm:w-auto md:w-full px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm text-sm">
                    ＜ 前のステップ
                </button>
                <button onclick="togglePlay()" id="play-btn" class="w-full sm:w-auto md:w-full px-6 py-3 bg-blue-500 text-white font-bold rounded-xl hover:bg-blue-600 active:scale-95 shadow-md transition flex items-center justify-center gap-2">
                    <svg id="icon-play" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg id="icon-pause" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="play-btn-text" class="text-base">再生</span>
                </button>
                <button onclick="nextStep()" id="next-btn" class="w-full sm:w-auto md:w-full px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm text-sm">
                    次のステップ ＞
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // アニメーションステップの定義
        const stepsData = [
            { title: "はじめに", text: "∠XOYの2辺に接する円を作図します。\n「2辺に接する円の中心」は、必ず【角の二等分線上】にあります。" },
            { title: "ステップ 1 : 角の二等分線の作図準備", text: "まずは角の二等分線を引きます。\n頂点Oにコンパスの針を刺し、辺OX, OYと交わるように弧を描きます。" },
            { title: "ステップ 2 : 2つの交点から弧を描く", text: "直線と交わった2か所に針を刺し、それぞれ同じ半径で弧を描きます。\n交点をPとします。" },
            { title: "ステップ 3 : 角の二等分線を引く", text: "定規を使って、頂点Oから点Pを通る直線を引きます。\n円の中心はすべてこの直線上に並びます。" },
            { title: "ステップ 4 : 円の中心を決める", text: "二等分線上に、1つ目の円の中心となる点C₁をとります。\n正確な半径を求めるため、C₁から辺OXへ弧を描いて垂線を下ろす準備をします。" },
            { title: "ステップ 5 : 辺OXへの垂線を下ろす", text: "辺OXとの交点2か所からそれぞれ弧を描き、下側に交点を作ります。" },
            { title: "ステップ 6 : 半径の決定", text: "点C₁から交点に向かって垂線を引きます。\n辺OXと垂直に交わる点までが、円の正確な半径になります。" },
            { title: "ステップ 7 : 1つ目の円を描く", text: "点C₁を中心に、求めた半径で円を描きます。\n辺OXと辺OYの両方にぴったり接する円ができました！" },
            { title: "ステップ 8 : 残りの円を描く", text: "同じようにして、二等分線上に別の中心をとり、垂線を下ろして円を描きます。\nこれで異なる半径の3つの円の完成です！" }
        ];

        // 状態管理
        let currentStepIndex = 0; 
        let stepProgress = 0; 
        let isPlaying = false;
        let lastTime = 0;

        // UIの更新
        function updateUI() {
            document.getElementById('step-title').innerText = stepsData[currentStepIndex].title;
            document.getElementById('step-text').innerText = stepsData[currentStepIndex].text;
            
            const btnText = document.getElementById('play-btn-text');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            
            if (isPlaying) {
                btnText.innerText = "一時停止";
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                if (stepProgress >= 1 && currentStepIndex === stepsData.length - 1) {
                    btnText.innerText = "最初から見る";
                } else if (stepProgress >= 1) {
                    btnText.innerText = "次へ再生";
                } else {
                    btnText.innerText = "再生";
                }
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
            
            document.getElementById('prev-btn').disabled = (currentStepIndex === 0 && stepProgress === 0);
            document.getElementById('next-btn').disabled = (currentStepIndex === stepsData.length - 1 && stepProgress >= 1);
        }

        function nextStep() {
            if (currentStepIndex < stepsData.length - 1) {
                currentStepIndex++;
                stepProgress = 0;
                isPlaying = true;
            } else {
                currentStepIndex = 0;
                stepProgress = 0;
                isPlaying = true;
            }
            updateUI();
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                if (stepProgress > 0) {
                    stepProgress = 0;
                    isPlaying = true;
                } else {
                    currentStepIndex--;
                    stepProgress = 0;
                    isPlaying = true;
                }
            }
            updateUI();
        }

        function togglePlay() {
            if (stepProgress >= 1) {
                if (currentStepIndex < stepsData.length - 1) {
                    nextStep();
                } else {
                    currentStepIndex = 0;
                    stepProgress = 0;
                    isPlaying = true;
                }
            } else {
                isPlaying = !isPlaying;
            }
            updateUI();
        }

        function getPhase(progress, start, end) {
            if (progress <= start) return 0;
            if (progress >= end) return 1;
            return (progress - start) / (end - start);
        }

        // 描画補助関数
        function drawRuler(ctx, x, y, length, angle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-20, 0, length + 40, 40);
            ctx.strokeRect(-20, 0, length + 40, 40);
            
            ctx.beginPath();
            for(let i = 0; i <= length; i += 10) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i, (i % 50 === 0) ? 15 : 8);
            }
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        function drawCompass(ctx, x, y, radius, drawAngle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(drawAngle);
            
            const hx = radius / 2;
            const hy = -150;
            
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(0, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#9ca3af'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(radius, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#60a5fa'; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 35);
            ctx.lineWidth = 10; ctx.strokeStyle = '#374151'; ctx.stroke();
            
            ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#d1d5db'; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#1f2937'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(radius - 8, -12); ctx.lineTo(radius, 0); ctx.lineTo(radius - 3, -14);
            ctx.fillStyle = '#1f2937'; ctx.fill();
            ctx.restore();
        }

        function drawBackground() {
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        // 座標計算
        const O = { x: 100, y: 480 };
        const angleY = -60 * Math.PI / 180;
        const angleBisect = -30 * Math.PI / 180;
        
        // ステップ1,2の交点
        const r0 = 160;
        const A = { x: O.x + r0, y: O.y };
        const B = { x: O.x + r0 * Math.cos(angleY), y: O.y + r0 * Math.sin(angleY) };
        const P = { x: O.x + 277.1 * Math.cos(angleBisect), y: O.y + 277.1 * Math.sin(angleBisect) };

        // 1つ目の円
        const distC1 = 300;
        const C1 = { x: O.x + distC1 * Math.cos(angleBisect), y: O.y + distC1 * Math.sin(angleBisect) }; // (359.8, 330)
        const rad1 = 150; // OX(y=480)までの距離 (480 - 330)
        
        // 垂線用の交点
        const rPerp = 180;
        const dx = Math.sqrt(rPerp * rPerp - rad1 * rad1); // 99.5
        const D = { x: C1.x - dx, y: 480 };
        const E = { x: C1.x + dx, y: 480 };
        const rPerp2 = 140;
        const dy = Math.sqrt(rPerp2 * rPerp2 - dx * dx); // 98.4
        const F = { x: C1.x, y: 480 + dy };

        // 2つ目、3つ目の円
        const distC2 = 140;
        const C2 = { x: O.x + distC2 * Math.cos(angleBisect), y: O.y + distC2 * Math.sin(angleBisect) };
        const rad2 = 70;
        const distC3 = 460;
        const C3 = { x: O.x + distC3 * Math.cos(angleBisect), y: O.y + distC3 * Math.sin(angleBisect) };
        const rad3 = 230;

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            let p = { arcO: 0, arcAB: 0, bisect: 0, arcC1: 0, arcDE: 0, perp: 0, circle1: 0, circle23: 0, finish: 0 };
            for (let i = 1; i <= 8; i++) {
                let key = Object.keys(p)[i-1]; // 8ステップにマッピング
                if (currentStepIndex > i) p[key] = 1.0;
                else if (currentStepIndex === i) p[key] = stepProgress;
                else p[key] = 0.0;
            }

            // ベースの角
            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(O.x, O.y); ctx.lineTo(O.x + 650, O.y); // OX
            ctx.moveTo(O.x, O.y); ctx.lineTo(O.x + 600 * Math.cos(angleY), O.y + 600 * Math.sin(angleY)); // OY
            ctx.stroke();

            // ラベル
            ctx.fillStyle = '#1f2937';
            ctx.font = "italic 24px 'M PLUS Rounded 1c', sans-serif";
            ctx.fillText("O", O.x - 25, O.y + 20);
            ctx.fillText("X", O.x + 630, O.y + 30);
            ctx.fillText("Y", O.x + 600 * Math.cos(angleY) - 30, O.y + 600 * Math.sin(angleY) + 20);

            // ステップ1: 頂点Oからの弧
            if (p.arcO > 0) {
                let alpha = getPhase(p.arcO, 0, 0.1) - getPhase(p.arcO, 0.9, 1.0);
                let arcT = getPhase(p.arcO, 0.1, 0.9);
                let startA = 10 * Math.PI / 180;
                let endA = -70 * Math.PI / 180;
                let currentA = startA + (endA - startA) * arcT;
                
                ctx.beginPath(); ctx.arc(O.x, O.y, r0, startA, currentA, true);
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                if (alpha > 0) drawCompass(ctx, O.x, O.y, r0, currentA, alpha);

                if (p.arcO >= 0.9) {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.arc(A.x, A.y, 4, 0, Math.PI*2); ctx.arc(B.x, B.y, 4, 0, Math.PI*2); ctx.fill();
                }
            }

            // ステップ2: 2つの交点からの弧
            if (p.arcAB > 0) {
                let p1 = getPhase(p.arcAB, 0, 0.5); // Aからの弧
                let p2 = getPhase(p.arcAB, 0.5, 1.0); // Bからの弧

                // Aからの弧
                if (p1 > 0) {
                    let alpha1 = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let t1 = getPhase(p1, 0.2, 0.8);
                    let s1 = -40 * Math.PI / 180; let e1 = -80 * Math.PI / 180;
                    let c1 = s1 + (e1 - s1) * t1;
                    ctx.beginPath(); ctx.arc(A.x, A.y, r0, s1, c1, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha1 > 0) drawCompass(ctx, A.x, A.y, r0, c1, alpha1);
                }

                // Bからの弧
                if (p2 > 0) {
                    let alpha2 = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let t2 = getPhase(p2, 0.2, 0.8);
                    let s2 = 20 * Math.PI / 180; let e2 = -20 * Math.PI / 180;
                    let c2 = s2 + (e2 - s2) * t2;
                    ctx.beginPath(); ctx.arc(B.x, B.y, r0, s2, c2, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha2 > 0) drawCompass(ctx, B.x, B.y, r0, c2, alpha2);
                }

                if (p2 >= 0.9) {
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(P.x, P.y, 4, 0, Math.PI*2); ctx.fill();
                }
            }

            // ステップ3: 二等分線を引く
            if (p.bisect > 0) {
                let alpha = getPhase(p.bisect, 0, 0.15) - getPhase(p.bisect, 0.85, 1.0);
                let lineT = getPhase(p.bisect, 0.15, 0.85);
                if (alpha > 0) drawRuler(ctx, O.x, O.y, 600, angleBisect, alpha);
                
                ctx.beginPath(); ctx.moveTo(O.x, O.y);
                ctx.lineTo(O.x + 600 * lineT * Math.cos(angleBisect), O.y + 600 * lineT * Math.sin(angleBisect));
                ctx.strokeStyle = '#9ca3af'; ctx.setLineDash([8, 4]); ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
            }

            // ステップ4: C1を決めて弧を描く
            if (p.arcC1 > 0) {
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(C1.x, C1.y, 5, 0, Math.PI*2); ctx.fill();
                ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif"; ctx.fillText("C₁", C1.x - 10, C1.y - 15);

                let alpha = getPhase(p.arcC1, 0.1, 0.2) - getPhase(p.arcC1, 0.9, 1.0);
                let arcT = getPhase(p.arcC1, 0.2, 0.9);
                let s = Math.PI / 4; let e = Math.PI * 3 / 4;
                let c = s + (e - s) * arcT;
                
                if (arcT > 0) {
                    ctx.beginPath(); ctx.arc(C1.x, C1.y, rPerp, s, c, false);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, C1.x, C1.y, rPerp, c, alpha);
                }
            }

            // ステップ5: 垂線の交点
            if (p.arcDE > 0) {
                let p1 = getPhase(p.arcDE, 0, 0.5);
                let p2 = getPhase(p.arcDE, 0.5, 1.0);

                if (p1 > 0) {
                    let alpha1 = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let t1 = getPhase(p1, 0.2, 0.8);
                    let s1 = Math.PI / 4; let e1 = Math.PI / 2 + 0.2;
                    let c1 = s1 + (e1 - s1) * t1;
                    ctx.beginPath(); ctx.arc(D.x, D.y, rPerp2, s1, c1, false);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha1 > 0) drawCompass(ctx, D.x, D.y, rPerp2, c1, alpha1);
                }

                if (p2 > 0) {
                    let alpha2 = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let t2 = getPhase(p2, 0.2, 0.8);
                    let s2 = Math.PI * 3 / 4; let e2 = Math.PI / 2 - 0.2;
                    let c2 = s2 + (e2 - s2) * t2;
                    ctx.beginPath(); ctx.arc(E.x, E.y, rPerp2, s2, c2, true);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha2 > 0) drawCompass(ctx, E.x, E.y, rPerp2, c2, alpha2);
                }
            }

            // ステップ6: 垂線を引く
            if (p.perp > 0) {
                let alpha = getPhase(p.perp, 0, 0.15) - getPhase(p.perp, 0.85, 1.0);
                let lineT = getPhase(p.perp, 0.15, 0.85);
                
                if (alpha > 0) drawRuler(ctx, C1.x, 250, 350, Math.PI/2, alpha);
                
                ctx.beginPath(); ctx.moveTo(C1.x, 300); ctx.lineTo(C1.x, 300 + 200 * lineT);
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                
                if (p.perp > 0.8) {
                    // 直角マーク
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(C1.x, 470); ctx.lineTo(C1.x + 10, 470); ctx.lineTo(C1.x + 10, 480); ctx.stroke();
                }
            }

            // ステップ7: 1つ目の円
            if (p.circle1 > 0) {
                let alpha = getPhase(p.circle1, 0, 0.1) - getPhase(p.circle1, 0.9, 1.0);
                let arcT = getPhase(p.circle1, 0.1, 0.9);
                let currentA = Math.PI/2 + Math.PI * 2 * arcT; // 垂線の接点(下)から描き始める
                
                ctx.beginPath(); ctx.arc(C1.x, C1.y, rad1, Math.PI/2, currentA, false);
                ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 3; ctx.stroke();
                if (alpha > 0) drawCompass(ctx, C1.x, C1.y, rad1, currentA, alpha);
            }

            // ステップ8: 残りの円
            if (p.circle23 > 0) {
                let p1 = getPhase(p.circle23, 0, 0.4); // 小さい円
                let p2 = getPhase(p.circle23, 0.4, 0.8); // 大きい円
                let p3 = getPhase(p.circle23, 0.8, 1.0); // 表示固定用

                // 中心点の表示
                ctx.fillStyle = '#ef4444'; ctx.font = "bold 20px 'M PLUS Rounded 1c', sans-serif";
                if (p.circle23 > 0) {
                    ctx.beginPath(); ctx.arc(C2.x, C2.y, 5, 0, Math.PI*2); ctx.fill(); ctx.fillText("C₂", C2.x - 10, C2.y - 15);
                }
                if (p.circle23 > 0.4) {
                    ctx.beginPath(); ctx.arc(C3.x, C3.y, 5, 0, Math.PI*2); ctx.fill(); ctx.fillText("C₃", C3.x - 10, C3.y - 15);
                }

                // C2の円
                if (p1 > 0) {
                    let alpha = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let arcT = getPhase(p1, 0.2, 0.8);
                    
                    // 垂線の補助線
                    ctx.beginPath(); ctx.moveTo(C2.x, C2.y); ctx.lineTo(C2.x, 480);
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                    
                    let c = Math.PI/2 + Math.PI * 2 * arcT;
                    ctx.beginPath(); ctx.arc(C2.x, C2.y, rad2, Math.PI/2, c, false);
                    ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 3; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, C2.x, C2.y, rad2, c, alpha);
                } else if (p.circle23 >= 0.4) {
                    ctx.beginPath(); ctx.arc(C2.x, C2.y, rad2, 0, Math.PI*2); ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(C2.x, C2.y); ctx.lineTo(C2.x, 480); ctx.strokeStyle = '#10b981'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                }

                // C3の円
                if (p2 > 0) {
                    let alpha = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let arcT = getPhase(p2, 0.2, 0.8);
                    
                    // 垂線の補助線
                    ctx.beginPath(); ctx.moveTo(C3.x, C3.y); ctx.lineTo(C3.x, 480);
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                    
                    let c = Math.PI/2 + Math.PI * 2 * arcT;
                    ctx.beginPath(); ctx.arc(C3.x, C3.y, rad3, Math.PI/2, c, false);
                    ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 3; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, C3.x, C3.y, rad3, c, alpha);
                } else if (p.circle23 >= 0.8) {
                    ctx.beginPath(); ctx.arc(C3.x, C3.y, rad3, 0, Math.PI*2); ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(C3.x, C3.y); ctx.lineTo(C3.x, 480); ctx.strokeStyle = '#10b981'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                }
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (isPlaying) {
                let duration = 2500;
                if (currentStepIndex === 1) duration = 2500; // 弧O
                if (currentStepIndex === 2) duration = 3000; // 弧AB
                if (currentStepIndex === 3) duration = 2000; // 直線
                if (currentStepIndex === 4) duration = 2500; // C1と弧
                if (currentStepIndex === 5) duration = 3000; // 弧DE
                if (currentStepIndex === 6) duration = 2000; // 垂線
                if (currentStepIndex === 7) duration = 3000; // 1つ目の円
                if (currentStepIndex === 8) duration = 4000; // 残りの円

                if (currentStepIndex > 0) {
                    stepProgress += dt / duration;
                    if (stepProgress >= 1.0) {
                        stepProgress = 1.0;
                        isPlaying = false;
                    }
                }
                updateUI();
            }

            drawScene();
            requestAnimationFrame(loop);
        }

        window.onload = () => {
            updateUI();
            requestAnimationFrame(loop);
        };
    </script>
</body>
