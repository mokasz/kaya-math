<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3点を通る円の作図</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f3f4f6;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-8 px-4">

    <div class="w-full max-w-4xl">
        <!-- ヘッダー -->
        <div class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">📐 3点を通る円の作図</h1>
            <p class="text-gray-600">「垂直二等分線」を2つ作図して、円の中心を見つけよう！</p>
        </div>

        <!-- キャンバスエリア -->
        <div class="w-full bg-white p-2 rounded-2xl shadow-xl border border-gray-200">
            <canvas id="simCanvas" width="800" height="600" class="w-full max-h-[45vh] object-contain rounded-xl bg-slate-50 block"></canvas>
        </div>

        <!-- コントロールと説明エリア -->
        <div class="flex flex-col md:flex-row gap-6 mt-6">
            <!-- 説明テキスト -->
            <div class="flex-1 bg-white p-6 rounded-2xl shadow-md border border-gray-200 flex flex-col justify-center min-h-[160px]">
                <h2 id="step-title" class="text-2xl font-bold text-blue-600 mb-3">読み込み中...</h2>
                <p id="step-text" class="text-gray-700 text-lg leading-relaxed whitespace-pre-wrap"></p>
            </div>

            <!-- ボタン類 -->
            <div class="flex flex-col sm:flex-row md:flex-col gap-3 justify-center shrink-0">
                <button onclick="prevStep()" id="prev-btn" class="w-full sm:w-auto md:w-full px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm">
                    ＜ 前のステップ
                </button>
                <button onclick="togglePlay()" id="play-btn" class="w-full sm:w-auto md:w-full px-8 py-4 bg-blue-500 text-white font-bold rounded-xl hover:bg-blue-600 active:scale-95 shadow-md transition flex items-center justify-center gap-2">
                    <svg id="icon-play" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg id="icon-pause" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="play-btn-text">再生</span>
                </button>
                <button onclick="nextStep()" id="next-btn" class="w-full sm:w-auto md:w-full px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm">
                    次のステップ ＞
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // アニメーションステップの定義
        const stepsData = [
            { title: "はじめに", text: "3点A, B, Cを通る円を作図します。\n「円の中心は、弦の垂直二等分線の上にある」という性質を利用します。" },
            { title: "ステップ 1 : 線分ABの垂直二等分線 (準備)", text: "点Aと点Bを基準に垂直二等分線を引くため、\nコンパスを適当な幅に開き、点Aと点Bそれぞれから弧を描きます。" },
            { title: "ステップ 2 : 線分ABの垂直二等分線を引く", text: "2つの弧の交点を通るように、定規を使って直線を引きます。\nこれが「線分ABの垂直二等分線」です。" },
            { title: "ステップ 3 : 線分BCの垂直二等分線 (準備)", text: "次に、点Bと点Cを基準にして同じように垂直二等分線を引きます。\n点Bと点Cから、それぞれ弧を描いて交点を作ります。" },
            { title: "ステップ 4 : 線分BCの垂直二等分線を引く", text: "交点を通る直線を引きます。\nこの直線と、先ほど引いた直線の【交点】が、円の中心Oになります！" },
            { title: "ステップ 5 : 円の中心と半径を合わせる", text: "コンパスの針を、見つけた中心Oに刺します。\n鉛筆の先を、点A（または点B, 点C）にピッタリ合わせます。" },
            { title: "ステップ 6 : 円を描く", text: "そのままコンパスをぐるっと回して、円を描きます。\n3点すべてを通るはずです。" },
            { title: "完成！", text: "これで「3点A, B, Cを通る円O」の完成です！\nこのように、外接円の中心は垂直二等分線の交点で求められます。" }
        ];

        // 状態管理
        let currentStepIndex = 0; 
        let stepProgress = 0; 
        let isPlaying = false;
        let lastTime = 0;

        // UIの更新
        function updateUI() {
            document.getElementById('step-title').innerText = stepsData[currentStepIndex].title;
            document.getElementById('step-text').innerText = stepsData[currentStepIndex].text;
            
            const btnText = document.getElementById('play-btn-text');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            
            if (isPlaying) {
                btnText.innerText = "一時停止";
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                if (stepProgress >= 1 && currentStepIndex === stepsData.length - 1) {
                    btnText.innerText = "最初から見る";
                } else if (stepProgress >= 1) {
                    btnText.innerText = "次へ再生";
                } else {
                    btnText.innerText = "再生";
                }
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
            
            document.getElementById('prev-btn').disabled = (currentStepIndex === 0 && stepProgress === 0);
            document.getElementById('next-btn').disabled = (currentStepIndex === stepsData.length - 1 && stepProgress >= 1);
        }

        function nextStep() {
            if (currentStepIndex < stepsData.length - 1) {
                currentStepIndex++;
                stepProgress = 0;
                isPlaying = true;
            } else {
                currentStepIndex = 0;
                stepProgress = 0;
                isPlaying = true;
            }
            updateUI();
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                if (stepProgress > 0) {
                    stepProgress = 0;
                    isPlaying = true;
                } else {
                    currentStepIndex--;
                    stepProgress = 0;
                    isPlaying = true;
                }
            }
            updateUI();
        }

        function togglePlay() {
            if (stepProgress >= 1) {
                if (currentStepIndex < stepsData.length - 1) {
                    nextStep();
                } else {
                    currentStepIndex = 0;
                    stepProgress = 0;
                    isPlaying = true;
                }
            } else {
                isPlaying = !isPlaying;
            }
            updateUI();
        }

        function getPhase(progress, start, end) {
            if (progress <= start) return 0;
            if (progress >= end) return 1;
            return (progress - start) / (end - start);
        }

        // 定規の描画
        function drawRuler(ctx, x, y, length, angle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-20, 0, length + 40, 40);
            ctx.strokeRect(-20, 0, length + 40, 40);
            
            ctx.beginPath();
            for(let i = 0; i <= length; i += 10) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i, (i % 50 === 0) ? 15 : 8);
            }
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        // コンパスの描画
        function drawCompass(ctx, x, y, radius, drawAngle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(drawAngle);
            
            const hx = radius / 2;
            const hy = -150;
            
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(0, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#9ca3af'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(radius, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#60a5fa'; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 35);
            ctx.lineWidth = 10; ctx.strokeStyle = '#374151'; ctx.stroke();
            
            ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#d1d5db'; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#1f2937'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(radius - 8, -12); ctx.lineTo(radius, 0); ctx.lineTo(radius - 3, -14);
            ctx.fillStyle = '#1f2937'; ctx.fill();
            ctx.restore();
        }

        function drawBackground() {
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        // --- 座標計算 ---
        const A = { x: 550, y: 420 };
        const B = { x: 380, y: 200 };
        const C = { x: 220, y: 450 };

        // 3点から外接円の中心(外心)を計算する関数
        function getCircumcenter(A, B, C) {
            const D = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
            const Ux = ((A.x*A.x + A.y*A.y) * (B.y - C.y) + (B.x*B.x + B.y*B.y) * (C.y - A.y) + (C.x*C.x + C.y*C.y) * (A.y - B.y)) / D;
            const Uy = ((A.x*A.x + A.y*A.y) * (C.x - B.x) + (B.x*B.x + B.y*B.y) * (A.x - C.x) + (C.x*C.x + C.y*C.y) * (B.x - A.x)) / D;
            return { x: Ux, y: Uy };
        }

        const O = getCircumcenter(A, B, C); // 中心O
        const R = Math.hypot(O.x - A.x, O.y - A.y); // 半径R

        // ABの垂直二等分線用のデータ
        const r1 = 180; // 作図用の弧の半径
        const angleAB = Math.atan2(B.y - A.y, B.x - A.x);
        const midAB = { x: (A.x + B.x)/2, y: (A.y + B.y)/2 };
        const perpAngleAB = angleAB + Math.PI / 2;
        
        // BCの垂直二等分線用のデータ
        const r2 = 180; // 作図用の弧の半径
        const angleBC = Math.atan2(C.y - B.y, C.x - B.x);
        const midBC = { x: (B.x + C.x)/2, y: (B.y + C.y)/2 };
        const perpAngleBC = angleBC + Math.PI / 2;

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            // 進行度の取得
            let p = { arcAB: 0, lineAB: 0, arcBC: 0, lineBC: 0, prepCircle: 0, circle: 0, finish: 0 };
            for (let i = 1; i <= 7; i++) {
                let key = Object.keys(p)[i-1];
                if (currentStepIndex > i) p[key] = 1.0;
                else if (currentStepIndex === i) p[key] = stepProgress;
                else p[key] = 0.0;
            }

            // 補助線（点同士を薄く結ぶ）
            ctx.beginPath();
            ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y);
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);

            // 点A, B, C の描画
            ctx.fillStyle = '#1f2937'; ctx.font = "italic 22px 'M PLUS Rounded 1c', sans-serif";
            ctx.beginPath(); ctx.arc(A.x, A.y, 4, 0, Math.PI*2); ctx.fill(); ctx.fillText("A", A.x + 15, A.y + 10);
            ctx.beginPath(); ctx.arc(B.x, B.y, 4, 0, Math.PI*2); ctx.fill(); ctx.fillText("B", B.x - 25, B.y - 10);
            ctx.beginPath(); ctx.arc(C.x, C.y, 4, 0, Math.PI*2); ctx.fill(); ctx.fillText("C", C.x - 25, C.y + 20);

            // 【ステップ1】 ABの垂直二等分線（弧）
            if (p.arcAB > 0) {
                let p1 = getPhase(p.arcAB, 0, 0.5); // Aからの弧
                let p2 = getPhase(p.arcAB, 0.5, 1.0); // Bからの弧
                
                // 点Aからの弧
                if (p1 > 0) {
                    let alpha = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let arcT = getPhase(p1, 0.2, 0.8);
                    let start = angleAB - 1.2; let end = angleAB + 1.2;
                    let current = start + (end - start) * arcT;
                    ctx.beginPath(); ctx.arc(A.x, A.y, r1, start, current, false);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, A.x, A.y, r1, current, alpha);
                }
                
                // 点Bからの弧
                if (p2 > 0) {
                    let alpha = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let arcT = getPhase(p2, 0.2, 0.8);
                    let start = angleAB + Math.PI - 1.2; let end = angleAB + Math.PI + 1.2;
                    let current = start + (end - start) * arcT;
                    ctx.beginPath(); ctx.arc(B.x, B.y, r1, start, current, false);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, B.x, B.y, r1, current, alpha);
                }
            }

            // 【ステップ2】 ABの垂直二等分線（直線）
            if (p.lineAB > 0) {
                let alpha = getPhase(p.lineAB, 0, 0.15) - getPhase(p.lineAB, 0.85, 1.0);
                let lineT = getPhase(p.lineAB, 0.15, 0.85);
                
                let startLine = { x: midAB.x - 200 * Math.cos(perpAngleAB), y: midAB.y - 200 * Math.sin(perpAngleAB) };
                if (alpha > 0) drawRuler(ctx, startLine.x, startLine.y, 400, perpAngleAB, alpha);
                
                ctx.beginPath(); ctx.moveTo(startLine.x, startLine.y);
                ctx.lineTo(startLine.x + 400 * lineT * Math.cos(perpAngleAB), startLine.y + 400 * lineT * Math.sin(perpAngleAB));
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.stroke();
            }

            // 【ステップ3】 BCの垂直二等分線（弧）
            if (p.arcBC > 0) {
                let p1 = getPhase(p.arcBC, 0, 0.5); // Bからの弧
                let p2 = getPhase(p.arcBC, 0.5, 1.0); // Cからの弧
                
                if (p1 > 0) {
                    let alpha = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let arcT = getPhase(p1, 0.2, 0.8);
                    let start = angleBC - 1.2; let end = angleBC + 1.2;
                    let current = start + (end - start) * arcT;
                    ctx.beginPath(); ctx.arc(B.x, B.y, r2, start, current, false);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke(); // 2つ目はオレンジ
                    if (alpha > 0) drawCompass(ctx, B.x, B.y, r2, current, alpha);
                }
                
                if (p2 > 0) {
                    let alpha = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let arcT = getPhase(p2, 0.2, 0.8);
                    let start = angleBC + Math.PI - 1.2; let end = angleBC + Math.PI + 1.2;
                    let current = start + (end - start) * arcT;
                    ctx.beginPath(); ctx.arc(C.x, C.y, r2, start, current, false);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, C.x, C.y, r2, current, alpha);
                }
            }

            // 【ステップ4】 BCの垂直二等分線（直線）
            if (p.lineBC > 0) {
                let alpha = getPhase(p.lineBC, 0, 0.15) - getPhase(p.lineBC, 0.85, 1.0);
                let lineT = getPhase(p.lineBC, 0.15, 0.85);
                
                let startLine = { x: midBC.x - 220 * Math.cos(perpAngleBC), y: midBC.y - 220 * Math.sin(perpAngleBC) };
                if (alpha > 0) drawRuler(ctx, startLine.x, startLine.y, 400, perpAngleBC, alpha);
                
                ctx.beginPath(); ctx.moveTo(startLine.x, startLine.y);
                ctx.lineTo(startLine.x + 400 * lineT * Math.cos(perpAngleBC), startLine.y + 400 * lineT * Math.sin(perpAngleBC));
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.stroke();

                // 中心Oのマーク
                if (p.lineBC > 0.8 || currentStepIndex > 4) {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.arc(O.x, O.y, 5, 0, Math.PI*2); ctx.fill();
                    ctx.font = "bold 24px 'M PLUS Rounded 1c', sans-serif";
                    ctx.fillText("O", O.x + 10, O.y - 10);
                }
            }

            // 【ステップ5】 円の準備（コンパス合わせる）
            if (p.prepCircle > 0 && currentStepIndex === 5) {
                let alpha = getPhase(p.prepCircle, 0, 0.2) - getPhase(p.prepCircle, 0.8, 1.0);
                let angleOA = Math.atan2(A.y - O.y, A.x - O.x);
                if (alpha > 0) drawCompass(ctx, O.x, O.y, R, angleOA, alpha);
            }

            // 【ステップ6】 円を描く
            if (p.circle > 0) {
                let alpha = getPhase(p.circle, 0, 0.05) - getPhase(p.circle, 0.95, 1.0);
                let arcT = getPhase(p.circle, 0.05, 0.95);
                let start = Math.atan2(A.y - O.y, A.x - O.x); // 点Aから描き始める
                let current = start + Math.PI * 2 * arcT;
                
                ctx.beginPath(); ctx.arc(O.x, O.y, R, start, current, false);
                ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 3; ctx.stroke();
                
                if (alpha > 0) drawCompass(ctx, O.x, O.y, R, current, alpha);
            }

            // 【ステップ7】 完成
            if (p.finish > 0) {
                ctx.globalAlpha = p.finish;
                // 中心からA, B, Cへの半径を点線で強調
                ctx.beginPath();
                ctx.moveTo(O.x, O.y); ctx.lineTo(A.x, A.y);
                ctx.moveTo(O.x, O.y); ctx.lineTo(B.x, B.y);
                ctx.moveTo(O.x, O.y); ctx.lineTo(C.x, C.y);
                ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                ctx.globalAlpha = 1;
            }
        }

        // アニメーションループ
        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (isPlaying) {
                let duration = 2500;
                if (currentStepIndex === 1) duration = 3000;
                if (currentStepIndex === 2) duration = 2000;
                if (currentStepIndex === 3) duration = 3000;
                if (currentStepIndex === 4) duration = 2000;
                if (currentStepIndex === 5) duration = 1500;
                if (currentStepIndex === 6) duration = 3500; // ぐるっと描くため長め

                if (currentStepIndex > 0) {
                    stepProgress += dt / duration;
                    if (stepProgress >= 1.0) {
                        stepProgress = 1.0;
                        isPlaying = false;
                    }
                }
                updateUI();
            }

            drawScene();
            requestAnimationFrame(loop);
        }

        window.onload = () => {
            updateUI();
            requestAnimationFrame(loop);
        };
    </script>
</body>
</html>
