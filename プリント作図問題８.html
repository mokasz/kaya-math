<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3辺から等距離にある点の作図</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f3f4f6;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-6 px-4">

    <div class="w-full max-w-4xl">
        <!-- ヘッダー -->
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">📐 3辺から等距離にある点の作図</h1>
            <p class="text-sm md:text-base text-gray-600">「角の二等分線」を作図して、条件を満たす点Pを見つけ出そう！</p>
        </div>

        <!-- キャンバスエリア -->
        <div class="w-full bg-white p-2 rounded-2xl shadow-xl border border-gray-200 flex justify-center">
            <canvas id="simCanvas" width="800" height="600" class="w-full max-h-[50vh] object-contain rounded-xl bg-slate-50 block"></canvas>
        </div>

        <!-- コントロールと説明エリア -->
        <div class="flex flex-col md:flex-row gap-4 mt-6">
            <!-- 説明テキスト -->
            <div class="flex-1 bg-white p-4 rounded-2xl shadow-md border border-gray-200 flex flex-col justify-center min-h-[140px]">
                <h2 id="step-title" class="text-xl md:text-2xl font-bold text-blue-600 mb-2">読み込み中...</h2>
                <p id="step-text" class="text-gray-700 text-sm md:text-base leading-relaxed whitespace-pre-wrap"></p>
            </div>

            <!-- ボタン類 -->
            <div class="flex flex-col sm:flex-row md:flex-col gap-2 justify-center shrink-0">
                <button onclick="prevStep()" id="prev-btn" class="w-full sm:w-auto md:w-full px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm text-sm">
                    ＜ 前のステップ
                </button>
                <button onclick="togglePlay()" id="play-btn" class="w-full sm:w-auto md:w-full px-6 py-3 bg-blue-500 text-white font-bold rounded-xl hover:bg-blue-600 active:scale-95 shadow-md transition flex items-center justify-center gap-2">
                    <svg id="icon-play" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg id="icon-pause" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="play-btn-text" class="text-base">再生</span>
                </button>
                <button onclick="nextStep()" id="next-btn" class="w-full sm:w-auto md:w-full px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 active:scale-95 disabled:opacity-50 disabled:active:scale-100 transition shadow-sm text-sm">
                    次のステップ ＞
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const stepsData = [
            { title: "はじめに", text: "「3辺AB, BC, CDから等距離にある点P」を作図します。\n『2辺から等距離』＝『角の二等分線』であることを利用します！" },
            { title: "ステップ 1 : ∠Bの二等分線の準備", text: "辺ABと辺BCから等距離にある点は、∠Bの二等分線上になります。\n点Bから適当な長さで弧を描き、辺との交点を作ります。" },
            { title: "ステップ 2 : ∠Bの二等分線を引く", text: "2つの交点からそれぞれ同じ半径で弧を描き、\n点Bとその交点を通る「∠Bの二等分線」を引きます。" },
            { title: "ステップ 3 : ∠Cの二等分線の準備", text: "今度は辺BCと辺CDから等距離にある点を見つけるため、\n点Cから適当な長さで弧を描き、辺との交点を作ります。" },
            { title: "ステップ 4 : ∠Cの二等分線を引く", text: "2つの交点からそれぞれ弧を描き、\n点Cとその交点を通る「∠Cの二等分線」を引きます。" },
            { title: "完成！", text: "2つの二等分線の交点が求める「点P」です！\n点Pから3つの辺へ下ろした垂線の長さ（距離）がすべて等しくなります。" }
        ];

        let currentStepIndex = 0; 
        let stepProgress = 0; 
        let isPlaying = false;
        let lastTime = 0;

        function updateUI() {
            document.getElementById('step-title').innerText = stepsData[currentStepIndex].title;
            document.getElementById('step-text').innerText = stepsData[currentStepIndex].text;
            
            const btnText = document.getElementById('play-btn-text');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            
            if (isPlaying) {
                btnText.innerText = "一時停止";
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                if (stepProgress >= 1 && currentStepIndex === stepsData.length - 1) {
                    btnText.innerText = "最初から見る";
                } else if (stepProgress >= 1) {
                    btnText.innerText = "次へ再生";
                } else {
                    btnText.innerText = "再生";
                }
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
            
            document.getElementById('prev-btn').disabled = (currentStepIndex === 0 && stepProgress === 0);
            document.getElementById('next-btn').disabled = (currentStepIndex === stepsData.length - 1 && stepProgress >= 1);
        }

        function nextStep() {
            if (currentStepIndex < stepsData.length - 1) {
                currentStepIndex++;
                stepProgress = 0;
                isPlaying = true;
            } else {
                currentStepIndex = 0;
                stepProgress = 0;
                isPlaying = true;
            }
            updateUI();
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                if (stepProgress > 0) {
                    stepProgress = 0;
                    isPlaying = true;
                } else {
                    currentStepIndex--;
                    stepProgress = 0;
                    isPlaying = true;
                }
            }
            updateUI();
        }

        function togglePlay() {
            if (stepProgress >= 1) {
                if (currentStepIndex < stepsData.length - 1) {
                    nextStep();
                } else {
                    currentStepIndex = 0;
                    stepProgress = 0;
                    isPlaying = true;
                }
            } else {
                isPlaying = !isPlaying;
            }
            updateUI();
        }

        function getPhase(progress, start, end) {
            if (progress <= start) return 0;
            if (progress >= end) return 1;
            return (progress - start) / (end - start);
        }

        function drawRuler(ctx, x, y, length, angle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-20, 0, length + 40, 40);
            ctx.strokeRect(-20, 0, length + 40, 40);
            
            ctx.beginPath();
            for(let i = 0; i <= length; i += 10) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i, (i % 50 === 0) ? 15 : 8);
            }
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        function drawCompass(ctx, x, y, radius, drawAngle, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(drawAngle);
            
            const hx = radius / 2;
            const hy = -150;
            
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(0, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#9ca3af'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(radius, 0);
            ctx.lineWidth = 6; ctx.strokeStyle = '#60a5fa'; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 35);
            ctx.lineWidth = 10; ctx.strokeStyle = '#374151'; ctx.stroke();
            
            ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#d1d5db'; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#1f2937'; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(radius - 8, -12); ctx.lineTo(radius, 0); ctx.lineTo(radius - 3, -14);
            ctx.fillStyle = '#1f2937'; ctx.fill();
            ctx.restore();
        }

        function drawBackground() {
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        // --- 座標計算 ---
        const A = { x: 250, y: 150 };
        const B = { x: 150, y: 450 };
        const C = { x: 600, y: 450 };
        const D = { x: 550, y: 150 };

        // ∠B の計算
        const angleBA = Math.atan2(A.y - B.y, A.x - B.x); // 約 -71.5° (-1.249 rad)
        const angleBC = 0; 
        const angleBisectB = (angleBA + angleBC) / 2;

        const rB1 = 120;
        const I1_B = { x: B.x + rB1 * Math.cos(angleBC), y: B.y + rB1 * Math.sin(angleBC) };
        const I2_B = { x: B.x + rB1 * Math.cos(angleBA), y: B.y + rB1 * Math.sin(angleBA) };
        
        const rB2 = 150;
        const halfAngleB = (angleBC - angleBA) / 2; // 正の値
        const distCrossB = rB1 * Math.cos(halfAngleB) + Math.sqrt(rB2*rB2 - Math.pow(rB1 * Math.sin(halfAngleB), 2));
        const Cross_B = { x: B.x + distCrossB * Math.cos(angleBisectB), y: B.y + distCrossB * Math.sin(angleBisectB) };
        const angle_I1B_to_Cross = Math.atan2(Cross_B.y - I1_B.y, Cross_B.x - I1_B.x);
        const angle_I2B_to_Cross = Math.atan2(Cross_B.y - I2_B.y, Cross_B.x - I2_B.x);

        // ∠C の計算
        const aCB = -Math.PI; // -180°
        const aCD = Math.atan2(D.y - C.y, D.x - C.x); // 約 -99.5° (-1.73 rad)
        const angleBisectC = (aCB + aCD) / 2;

        const rC1 = 120;
        const I1_C = { x: C.x + rC1 * Math.cos(aCB), y: C.y + rC1 * Math.sin(aCB) };
        const I2_C = { x: C.x + rC1 * Math.cos(aCD), y: C.y + rC1 * Math.sin(aCD) };
        
        const rC2 = 150;
        const halfAngleC = (aCD - aCB) / 2; // 正の値
        const distCrossC = rC1 * Math.cos(halfAngleC) + Math.sqrt(rC2*rC2 - Math.pow(rC1 * Math.sin(halfAngleC), 2));
        const Cross_C = { x: C.x + distCrossC * Math.cos(angleBisectC), y: C.y + distCrossC * Math.sin(angleBisectC) };
        const angle_I1C_to_Cross = Math.atan2(Cross_C.y - I1_C.y, Cross_C.x - I1_C.x);
        const angle_I2C_to_Cross = Math.atan2(Cross_C.y - I2_C.y, Cross_C.x - I2_C.x);

        // 点P (二等分線の交点)
        const mB = Math.tan(angleBisectB);
        const mC = Math.tan(angleBisectC);
        const Px = (mB * B.x - mC * C.x) / (mB - mC);
        const Py = B.y + mB * (Px - B.x);
        const P = { x: Px, y: Py };

        // 垂線の足
        function getPerpendicularFoot(Pt, pA, pB) {
            const dx = pB.x - pA.x;
            const dy = pB.y - pA.y;
            const t = ((Pt.x - pA.x) * dx + (Pt.y - pA.y) * dy) / (dx * dx + dy * dy);
            return { x: pA.x + t * dx, y: pA.y + t * dy };
        }
        const F_AB = getPerpendicularFoot(P, B, A);
        const F_BC = getPerpendicularFoot(P, B, C); // (P.x, 450)
        const F_CD = getPerpendicularFoot(P, C, D);

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            let p = { arcB1: 0, arcB2: 0, lineB: 0, arcC1: 0, arcC2: 0, lineC: 0, finish: 0 };
            for (let i = 1; i <= 6; i++) {
                if (currentStepIndex > i - 1) {
                    if (i === 1) p.arcB1 = 1.0;
                    else if (i === 2) { p.arcB2 = 1.0; p.lineB = 1.0; }
                    else if (i === 3) p.arcC1 = 1.0;
                    else if (i === 4) { p.arcC2 = 1.0; p.lineC = 1.0; }
                    else if (i === 5) p.finish = 1.0;
                } else if (currentStepIndex === i - 1) {
                    if (i === 1) p.arcB1 = stepProgress;
                    else if (i === 2) {
                        p.arcB2 = getPhase(stepProgress, 0, 0.6);
                        p.lineB = getPhase(stepProgress, 0.6, 1.0);
                    }
                    else if (i === 3) p.arcC1 = stepProgress;
                    else if (i === 4) {
                        p.arcC2 = getPhase(stepProgress, 0, 0.6);
                        p.lineC = getPhase(stepProgress, 0.6, 1.0);
                    }
                    else if (i === 5) p.finish = stepProgress;
                }
            }

            // 四角形 ABCD
            ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y); ctx.lineTo(D.x, D.y); ctx.closePath();
            ctx.stroke();

            // 頂点の文字
            ctx.fillStyle = '#1f2937'; ctx.font = "italic 24px 'M PLUS Rounded 1c', sans-serif";
            ctx.fillText("A", A.x - 25, A.y - 10);
            ctx.fillText("B", B.x - 25, B.y + 25);
            ctx.fillText("C", C.x + 10, C.y + 25);
            ctx.fillText("D", D.x + 15, D.y - 5);

            // 【ステップ1】 ∠Bの二等分線の準備
            if (p.arcB1 > 0) {
                let alpha = getPhase(p.arcB1, 0, 0.1) - getPhase(p.arcB1, 0.9, 1.0);
                let arcT = getPhase(p.arcB1, 0.1, 0.9);
                let s = angleBC; let e = angleBA;
                let c = s + (e - s) * arcT;
                ctx.beginPath(); ctx.arc(B.x, B.y, rB1, s, c, true); // true = 反時計回り (角度が減る方向)
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                if (alpha > 0) drawCompass(ctx, B.x, B.y, rB1, c, alpha);
                
                if (p.arcB1 >= 0.9 || currentStepIndex > 1) {
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(I1_B.x, I1_B.y, 4, 0, Math.PI*2); ctx.arc(I2_B.x, I2_B.y, 4, 0, Math.PI*2); ctx.fill();
                }
            }

            // 【ステップ2】 ∠Bの二等分線を引く
            if (p.arcB2 > 0) {
                let p1 = getPhase(p.arcB2, 0, 0.5);
                let p2 = getPhase(p.arcB2, 0.5, 1.0);
                
                if (p1 > 0) {
                    let alpha = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let arcT = getPhase(p1, 0.2, 0.8);
                    let s = angle_I1B_to_Cross + 0.4; let e = angle_I1B_to_Cross - 0.4;
                    let c = s + (e - s) * arcT;
                    ctx.beginPath(); ctx.arc(I1_B.x, I1_B.y, rB2, s, c, true);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, I1_B.x, I1_B.y, rB2, c, alpha);
                }
                if (p2 > 0) {
                    let alpha = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let arcT = getPhase(p2, 0.2, 0.8);
                    let s = angle_I2B_to_Cross - 0.4; let e = angle_I2B_to_Cross + 0.4;
                    let c = s + (e - s) * arcT;
                    ctx.beginPath(); ctx.arc(I2_B.x, I2_B.y, rB2, s, c, false);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, I2_B.x, I2_B.y, rB2, c, alpha);
                }
            }
            if (p.lineB > 0) {
                let alpha = getPhase(p.lineB, 0, 0.15) - getPhase(p.lineB, 0.85, 1.0);
                let lineT = getPhase(p.lineB, 0.15, 0.85);
                let len = Math.hypot(P.x - B.x, P.y - B.y) + 80;
                
                if (alpha > 0) drawRuler(ctx, B.x, B.y, len, angleBisectB, alpha);
                
                ctx.beginPath(); ctx.moveTo(B.x, B.y);
                ctx.lineTo(B.x + len * lineT * Math.cos(angleBisectB), B.y + len * lineT * Math.sin(angleBisectB));
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.stroke();
            }

            // 【ステップ3】 ∠Cの二等分線の準備
            if (p.arcC1 > 0) {
                let alpha = getPhase(p.arcC1, 0, 0.1) - getPhase(p.arcC1, 0.9, 1.0);
                let arcT = getPhase(p.arcC1, 0.1, 0.9);
                let s = aCB; let e = aCD;
                let c = s + (e - s) * arcT;
                ctx.beginPath(); ctx.arc(C.x, C.y, rC1, s, c, false); // 時計回り (角度が増える方向)
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke(); // オレンジ
                if (alpha > 0) drawCompass(ctx, C.x, C.y, rC1, c, alpha);
                
                if (p.arcC1 >= 0.9 || currentStepIndex > 3) {
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(I1_C.x, I1_C.y, 4, 0, Math.PI*2); ctx.arc(I2_C.x, I2_C.y, 4, 0, Math.PI*2); ctx.fill();
                }
            }

            // 【ステップ4】 ∠Cの二等分線を引く
            if (p.arcC2 > 0) {
                let p1 = getPhase(p.arcC2, 0, 0.5);
                let p2 = getPhase(p.arcC2, 0.5, 1.0);
                
                if (p1 > 0) {
                    let alpha = getPhase(p1, 0, 0.2) - getPhase(p1, 0.8, 1.0);
                    let arcT = getPhase(p1, 0.2, 0.8);
                    let s = angle_I1C_to_Cross - 0.4; let e = angle_I1C_to_Cross + 0.4;
                    let c = s + (e - s) * arcT;
                    ctx.beginPath(); ctx.arc(I1_C.x, I1_C.y, rC2, s, c, false);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, I1_C.x, I1_C.y, rC2, c, alpha);
                }
                if (p2 > 0) {
                    let alpha = getPhase(p2, 0, 0.2) - getPhase(p2, 0.8, 1.0);
                    let arcT = getPhase(p2, 0.2, 0.8);
                    let s = angle_I2C_to_Cross + 0.4; let e = angle_I2C_to_Cross - 0.4;
                    let c = s + (e - s) * arcT;
                    ctx.beginPath(); ctx.arc(I2_C.x, I2_C.y, rC2, s, c, true);
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                    if (alpha > 0) drawCompass(ctx, I2_C.x, I2_C.y, rC2, c, alpha);
                }
            }
            if (p.lineC > 0) {
                let alpha = getPhase(p.lineC, 0, 0.15) - getPhase(p.lineC, 0.85, 1.0);
                let lineT = getPhase(p.lineC, 0.15, 0.85);
                let len = Math.hypot(P.x - C.x, P.y - C.y) + 80;
                
                if (alpha > 0) drawRuler(ctx, C.x, C.y, len, angleBisectC, alpha);
                
                ctx.beginPath(); ctx.moveTo(C.x, C.y);
                ctx.lineTo(C.x + len * lineT * Math.cos(angleBisectC), C.y + len * lineT * Math.sin(angleBisectC));
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.stroke();
            }

            // 【ステップ5】 完成（等距離の確認）
            if (p.finish > 0) {
                ctx.globalAlpha = p.finish;
                
                // 点Pのマーク
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(P.x, P.y, 6, 0, Math.PI*2); ctx.fill();
                ctx.font = "bold 24px 'M PLUS Rounded 1c', sans-serif";
                ctx.fillText("P", P.x - 10, P.y - 15);
                
                // 垂線（距離）を点線で描画
                ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
                ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(F_AB.x, F_AB.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(F_BC.x, F_BC.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(F_CD.x, F_CD.y); ctx.stroke();
                ctx.setLineDash([]);

                // 等距離マーク（平行な2本線）
                const drawTick = (p1, p2) => {
                    const mx = (p1.x + p2.x) / 2;
                    const my = (p1.y + p2.y) / 2;
                    const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x); // 線分の角度
                    const px = Math.cos(ang); const py = Math.sin(ang);
                    const nx = Math.cos(ang + Math.PI/2); const ny = Math.sin(ang + Math.PI/2);
                    
                    ctx.beginPath();
                    // 1本目
                    ctx.moveTo(mx + 3*px - 6*nx, my + 3*py - 6*ny);
                    ctx.lineTo(mx + 3*px + 6*nx, my + 3*py + 6*ny);
                    // 2本目
                    ctx.moveTo(mx - 3*px - 6*nx, my - 3*py - 6*ny);
                    ctx.lineTo(mx - 3*px + 6*nx, my - 3*py + 6*ny);
                    ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 2; ctx.stroke();
                };
                
                drawTick(P, F_AB);
                drawTick(P, F_BC);
                drawTick(P, F_CD);

                ctx.globalAlpha = 1;
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (isPlaying) {
                let duration = 2500;
                if (currentStepIndex === 1) duration = 2000;
                if (currentStepIndex === 2) duration = 4000; // 弧2つ+直線
                if (currentStepIndex === 3) duration = 2000;
                if (currentStepIndex === 4) duration = 4000; // 弧2つ+直線
                if (currentStepIndex === 5) duration = 2000; 

                if (currentStepIndex > 0) {
                    stepProgress += dt / duration;
                    if (stepProgress >= 1.0) {
                        stepProgress = 1.0;
                        isPlaying = false;
                    }
                }
                updateUI();
            }

            drawScene();
            requestAnimationFrame(loop);
        }

        window.onload = () => {
            updateUI();
            requestAnimationFrame(loop);
        };
    </script>
</body>
</html>
